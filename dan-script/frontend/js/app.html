      const page = $btn.data("page");
      if (!page) {
        return;
      }
      const appContainer = document.querySelector(".app-container");
      if (window.matchMedia("(min-width: 992px)").matches) {
        if (appContainer) {
          appContainer.classList.add("closed-sidebar");
        }
      } else {
        if (appContainer) {
          appContainer.classList.remove("sidebar-mobile-open");
        }
        const hamburger = document.querySelector(".app-header__mobile-menu .hamburger");
        if (hamburger) {
          hamburger.classList.remove("is-active");
        }
      }
      document.getElementById("app-main-inner-container").classList.add("opacity-0");
      RouterModule.go(page);
    }
    function shouldIgnore($btn) {
      return $btn.hasClass("mm-active") || $btn.is("[aria-expanded]") && $btn.next().prop("tagName") === "UL";
    }
    return {
      init,
      destroy
    };
  })();

  // src/app.js
  document.addEventListener("DOMContentLoaded", () => {
    RouterModule.init();
    ActionRouterModule.init();
    AppUI.init();
    RouterModule.go(RouterModule.getCurrentPage());
  });
})();


</script>
