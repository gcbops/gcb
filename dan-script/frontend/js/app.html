        return;
      }

        chart.options.animation = false;
        chart.options.animations = {};
        if (chart._waveAnimation) {
          cancelAnimationFrame(chart._waveAnimation);
          chart._waveAnimation = null;
        }
        if (chart._waveOriginalData) {
          chart.data.datasets[0].data = [...chart._waveOriginalData];
          chart._waveOriginalData = null;
        }
        chart.update("none");
        return;
      }
      if (chart._waveAnimation) {
        return;
      }
      const dataset = chart.data.datasets[0];
      chart._waveOriginalData = [...dataset.data];
      const originalData = chart._waveOriginalData;
      const startTime = performance.now();
      function wave(time) {
        if (!chartInstances[type]) {
          return;
        }
        const elapsed = time - startTime;
        const progress = elapsed % duration / duration;
        dataset.data = originalData.map((value, index) => {
          const wave2 = Math.sin(index * 0.7 + progress * Math.PI * 2) * 0.025;
          return value * (1 + wave2);
        });
        chart.update("none");
        chart._waveAnimation = requestAnimationFrame(wave);
      }

      if (!result?.success || !result?.url) {
        throw new Error("The Billing Records CSV could not be generated.");
      }
      updateProgress("Billing Records CSV generated successfully");
      return {
        ...result,
        reportUrl: result.url,
        reportType: "csv"
      };
    }
  );
  RequestManager.registerHandler(
    "send-report-email",
    async (payload, { requestId, updateProgress }) => {
      if (!requestId) {
        throw new Error("Missing request ID for email delivery.");
      }
      const reportId = String(payload?.reportId || "").trim();
      if (!reportId) {
        throw new Error("The report ID is missing.");
      }
      const serverFunction = payload.isDataExport ? "sendBillingRecordsCSVEmail" : "sendRequestedEmailReport";
      updateProgress("Authorizing email delivery");
      const [sessionId, signature] = await getAuthArgs();
      updateProgress("Sending report by email");
      const result = await callGScriptAsync(serverFunction, [
        sessionId,
        signature,
        reportId
      ]);
      if (result?.success === false) {
        throw new Error(result.message || "Report email delivery failed.");
      }
      return {
        reportId,
        reportType: payload.reportType,
        channel: "email",
        ...result && typeof result === "object" ? result : {}
      };
    }
  );
  RequestManager.registerHandler(
    "send-report-discord",
    async (payload, { requestId, updateProgress }) => {
      if (!requestId) {
        throw new Error("Missing request ID for Discord delivery.");
      }
      const reportId = String(payload?.reportId || "").trim();
      if (!reportId) {
        throw new Error("The report ID is missing.");
      }
      const serverFunction = payload.isDataExport ? "sendBillingRecordsCSVDiscord" : "sendRequestedDiscordReport";
      updateProgress("Authorizing Discord delivery");
      const [sessionId, signature] = await getAuthArgs();
      updateProgress("Sending report to Discord");
      const result = await callGScriptAsync(serverFunction, [
        sessionId,
        signature,
        reportId
      ]);
      if (result?.success === false) {
        throw new Error(result.message || "Report Discord delivery failed.");
      }
      return {
        reportId,
        reportType: payload.reportType,
        channel: "discord",
        ...result && typeof result === "object" ? result : {}
      };
    }
  );
  RequestManager.registerHandler(
    "create-client-sheet",
    async (payload, { requestId, updateProgress }) => {
      if (!requestId) {
        throw new Error("Missing request ID for client creation.");
      }
      const clientName = String(payload?.name || "").trim();
      if (!clientName) {
        throw new Error("A client name is required.");
      }
      updateProgress("Authorizing client creation");
      const [sessionId, signature] = await getAuthArgs();
      updateProgress("Creating client sheet");
      await callGScriptAsync("createClientSheet", [
        sessionId,
        signature,
        { name: clientName },
        requestId
      ]);
      updateProgress("Client sheet created successfully");
      return { success: true, clientName };
    }
  );
  RequestManager.registerHandler(
    "create-external-sheet",
    async (payload, { requestId, updateProgress }) => {
      if (!requestId) {
        throw new Error("Missing request ID for external sheet creation.");
      }
      const clientName = String(payload?.clientName || "").trim();
      const projects = String(payload?.projects || "").trim();
      if (!clientName) {
        throw new Error("A client name is required.");
      }
      if (!projects) {
        throw new Error("At least one project is required.");
      }
      updateProgress("Authorizing external sheet creation");
      const [sessionId, signature] = await getAuthArgs();
      updateProgress("Creating external spreadsheet");
      const result = await callGScriptAsync("createExternalSheet", [
        sessionId,
        signature,
        {
          clientName,
          projects
        },
        requestId
      ]);
      updateProgress("External sheet created successfully");
      return result;
    }
  );
  RequestManager.registerHandler(
    "update-client-record-status",
    async (payload, { updateProgress }) => {
      const clientName = String(payload?.clientName || "").trim();
      const operations = payload?.operations;
      if (!clientName) {
        throw new Error("A client name is required.");
      }
      if (!Array.isArray(operations) || operations.length === 0) {
        throw new Error("At least one status update is required.");
      }
      updateProgress("Authorizing client status updates");
      const [sessionId, signature] = await getAuthArgs();
      const results = [];
      for (let index = 0; index < operations.length; index++) {
        const operation = operations[index];
        updateProgress(
          `Updating record ${index + 1} of ${operations.length}`
        );
        try {
          const result = await callGScriptAsync(
            "updateClientRecordStatus",
            [
              sessionId,
              signature,
              {
                ...operation,
                clientName,
                spreadsheetId: payload.spreadsheetId,
                sheetId: payload.sheetId
              }
            ]
          );
          results.push({
            rowIndex: operation.rowIndex,
            success: true,
            result
          });
        } catch (error) {
          results.push({
            rowIndex: operation.rowIndex,
            success: false,
            message: error?.message || "Status update failed."
          });
        }
      }
      const failed = results.filter((item) => !item.success);
      if (failed.length) {
        const error = new Error(
          `${failed.length} of ${operations.length} status update(s) failed. Review the operation results before retrying.`
        );
        error.results = results;
        throw error;
      }
      updateProgress("Client statuses updated successfully");
      document.dispatchEvent(
        new CustomEvent("gcb:client-record-status-updated", {
          detail: {
            clientName,
            results
          }
        })
      );
      return {
        success: true,
        clientName,
        results
      };
    }
  );

  // src/app.js
  setInvalidSessionUIHandler(() => {
    GcbLoginModule.show();
  });
  document.addEventListener("DOMContentLoaded", async () => {
    LoaderModule.start("loading");
    GcbLoginModule.init();
    const authenticated = await GcbAuthModule.init();
    if (!authenticated) {
      LoaderModule.restart("login");
      GcbLoginModule.show();
      return;
    }
    GcbLoginModule.hide();
    AuthorizationUIModule.applyNavigationPermissions();
    RequestWidget.init();
    RouterModule.init();
    ActionRouterModule.init();
  });
})();


</script>
