<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <style>
      body { padding: 24px; font-family: system-ui, Verdana, sans-serif; }
      .container { display: flex; flex-direction: column; gap: 16px; }
      label { font-size: 13px; margin-bottom: 6px; color:#334155; font-weight: 600; }
      input[type=text] { 
        width: 100%; 
        height: 38px; 
        padding: 10px 12px; 
        margin: 6px 0 14px 0; 
        border: 1px solid #e6e9ee; 
        border-radius: 8px; 
        font-size: 14px; 
        outline: none; 
      }
      input[type=text]:focus {
        border-color: #0ea5e9;
        box-shadow: 0 0 0 2px rgba(14,165,233,0.2);
      }
      .actions { display:flex; gap:8px; align-items:center; margin-top:10px }
      button { 
        background-image: linear-gradient(to top, #e6e9f0 0%, #eef1f5 100%); 
        color:#334155; 
        padding: 12px 16px; 
        border-radius: 8px; 
        font-weight:600; 
        border: 0; 
        cursor:pointer; 
        transition:all .36s cubic-bezier(.2,.9,.2,1);
      }
      button:hover { background: #334155; color:#e6e9f0; }
      .error { font-size:13px; color:#dc2626; margin-top:6px; }
      h3 { margin: 0 0 10px; color:#0f172a; }
    </style>
  </head>
  <body>
    <div class="container"> 

      <div>
        <label>Client Name</label>
        <input type="text" id="clientName" placeholder="Enter client name">
      </div>

      <div>
        <label>Project Name</label>
        <input type="text" id="projectName" placeholder="Enter project name">
      </div>

      <div class="actions">
        <button onclick="createClientSheet()">Save</button>
        <button onclick="google.script.host.close()">Cancel</button>
      </div>

      <div class="error" id="errorMsg"></div>
    </div>

    <script>
      function createClientSheet() {
        const client = document.getElementById('clientName').value.trim();
        const project = document.getElementById('projectName').value.trim();
        const errorMsg = document.getElementById('errorMsg');

        if (!client || !project) {
          errorMsg.textContent = '⚠️ Please fill out both fields.';
          return;
        }

        const input = `${client} - ${project}`;
        errorMsg.textContent = '';

        google.script.run
          .withSuccessHandler(() => {
            errorMsg.style.color = '#16a34a';
            errorMsg.textContent = '✅ Sheet created successfully!';

            // ✅ Refresh client list in localStorage immediately after creation
            console.log("🔄 Fetching updated client list...");
            google.script.run
              .withSuccessHandler(clients => {
                if (Array.isArray(clients)) {
                  localStorage.setItem("clientList", JSON.stringify(clients));
                  localStorage.setItem("clientList_time", Date.now());
                  console.log("✅ clientList updated in localStorage");
                  setTimeout(() => google.script.host.close(), 1200);
                }
              })
              .withFailureHandler(() =>
                console.log("❌ Failed to refresh clientList after sheet creation")
              )
              .getClientOptions(); // your existing GS function that returns the client list

          })
          .withFailureHandler(err => {
            errorMsg.style.color = '#dc2626';
            errorMsg.textContent = '❌ ' + err.message;
          })
          .createClientSheet(input);
      }

    </script>
  </body>
</html>
