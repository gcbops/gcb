<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- DataTables (Bootstrap 5 theme) -->
  <link href="https://cdn.datatables.net/2.3.4/css/dataTables.bootstrap5.min.css" rel="stylesheet"/>

  <style>
    body { padding: 24px; font-family: system-ui, Verdana, sans-serif; }
    h6 { text-align: center; text-transform: uppercase }
    table { margin: 15px 0; }
    thead th { border-color: #ccc !important; }
    tbody td { border-bottom: none!important; }
    thead th:nth-child(4) .dt-column-title, tbody td:nth-child(4) { text-align: center; }

    #containerexample {display: none}
    #loadercontainer{ position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); }

    /* DataTable custom */
    .dt-buttons { margin-bottom: 12px; }
    .dt-paging { margin-top: 25px !important; }
    .dt-paging-button button { background: #fff !important; border-color: #ccc !important; color: #c5963c }
    .dt-paging-button.active button { background: #f9f9f9; color: #666 }
    table tbody tr:hover td { background: #f9f9f9 !important; color: #c5963c!important; }
  </style>
</head>

<body>
  <h6><?= title ?></h6>

  <div class="container" id="containerexample">
    <table id="hourLogTable" class="table nowrap" style="width:100%">
      <thead>
        <tr>
          <th>Type</th>
          <th>Project</th>
          <th>Hrs Rendered</th>
          <th>Date</th>
        </tr>
      </thead>
      <tbody id="hourLogBody">
      </tbody>
    </table>
  </div>

  <div id="loadercontainer">
  <div class="d-flex justify-content-center text-warning" id="loader">
        <div class="spinner-border" role="status">
            <span class="sr-only"></span>
        </div>
    </div>
  </div>

  <!-- JS libs -->
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.datatables.net/2.3.4/js/dataTables.min.js"></script>
  <script src="https://cdn.datatables.net/2.3.4/js/dataTables.bootstrap5.min.js"></script>
  <script src="https://cdn.datatables.net/plug-ins/1.13.6/sorting/datetime-moment.js"></script>

<script>
document.addEventListener("DOMContentLoaded", function () {
  const clientName = "<?= clientName ?>";
  
  const tableOptions = {
    topStart: 'pageLength',
    topEnd: 'search',
    bottomStart: 'info',
    bottomEnd: 'paging',
    paging: true,
    order: [[3, 'desc']],
    columnDefs: [
      { type: 'date', targets: 3 }
    ]
  };

  google.script.run
    .withSuccessHandler(function(data) {

      // guard: treat null/undefined as empty array
      if (!Array.isArray(data) || data.length === 0) {
        document.getElementById('hourLogBody').innerHTML =
          '<tr><td colspan="4" class="text-center text-muted">No data found</td></tr>';
        // ensure any existing DataTable destroyed
        if ($.fn.DataTable.isDataTable('#hourLogTable')) {
          $('#hourLogTable').DataTable().destroy();
        }
        return;
      }

      const tbody = document.getElementById('hourLogBody');
      tbody.innerHTML = '';

      data.forEach(function(row) {
        const tr = document.createElement('tr');
        row.forEach(function(cell) {
          const td = document.createElement('td');
          td.textContent = (cell === null || cell === undefined) ? '' : cell;
          tr.appendChild(td);
        });
        tbody.appendChild(tr);
      });

      // init / re-init datatable AFTER DOM rows inserted
      if ($.fn.DataTable.isDataTable('#hourLogTable')) {
        $('#hourLogTable').DataTable().destroy();
      }
      dataTable = $('#hourLogTable')
      .on('draw.dt', function () {
        $("#containerexample").attr("id", "container");
        $("#loadercontainer").css("display", "none");
      })
      .DataTable(tableOptions);
    })
    .withFailureHandler(function(err) {
      console.error('❌ google.script.run failed:', err);
      document.getElementById('hourLogBody').innerHTML =
        '<tr><td colspan="4" class="text-center text-danger">Error loading data</td></tr>';
    })
    .getClientHourLogData(clientName);
});
</script>



</body>
</html>
