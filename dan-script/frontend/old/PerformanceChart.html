<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Performance Chart</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <script>
      document.addEventListener("DOMContentLoaded", () => loadChart("<?= chartType ?>"));

      let chartInstance;

      function loadChart(type) {
        const chartDiv = document.getElementById("chart_div");
        chartDiv.innerText = "Loading chart...";
        document.getElementById("chartTitle").innerText =
          type === "monthly" ? "Monthly Chart" : "Daily Chart";

        const func = type === "monthly" ? "getMonthlyChartData" : "getDailyChartData";
        const cacheKey = `chartData_${type}`;
        const cacheTimeKey = `chartDataTime_${type}`;
        const cached = localStorage.getItem(cacheKey);
        const cacheTime = Number(localStorage.getItem(cacheTimeKey) || 0);
        const ONE_DAY = 24 * 60 * 60 * 1000;
        
        if (type === "monthly") {
          document.getElementById("loadPrevYear").style.display = "block";
        } else {
          document.getElementById("loadPrevYear").style.display = "none";
        }

        // --- If cache exists AND has data ---
        if (cached) {
          try {
            const parsed = JSON.parse(cached);
            if (Array.isArray(parsed) && parsed.length > 0) {
              console.log(`📊 Loaded ${type} chart from cache`);
              drawChart(parsed);

              // Background refresh if older than 24h
              const expired = (Date.now() - cacheTime) > ONE_DAY;
              if (expired) {
                console.log("🔄 Cache expired, refreshing data in background...");
                refreshChartData(type, func, cacheKey, cacheTimeKey, false);
              }
              return;
            } 
            // If cached data is empty array, fetch fresh
            console.log("⚠️ Cached chart data empty, fetching fresh data...");
          } catch (e) {
            console.warn("⚠️ Cache parse failed, refetching from GS", e);
          }
        }

        // --- No valid cache or empty cache, fetch fresh ---
        console.log(`🆕 Fetching fresh ${type} chart data...`);
        refreshChartData(type, func, cacheKey, cacheTimeKey, true);
      }

      function refreshChartData(type, func, cacheKey, cacheTimeKey, drawAfterFetch) {
        google.script.run
          .withSuccessHandler(dataArray => {
            if (!Array.isArray(dataArray) || !dataArray.length) {
              document.getElementById("chart_div").innerText = "No data found.";
              return;
            }

            // Save to localStorage
            localStorage.setItem(cacheKey, JSON.stringify(dataArray));
            localStorage.setItem(cacheTimeKey, Date.now());
            console.log(`✅ ${type} chart data saved to cache`);

            if (drawAfterFetch) drawChart(dataArray);
          })
          .withFailureHandler(err => {
            console.error(`❌ Failed to fetch ${type} chart data`, err);
            document.getElementById("chart_div").innerText = "Failed to load chart.";
          })[func]();
      }

      function drawChart(dataArray) {
        const chartDiv = document.getElementById("chart_div");
        if (!Array.isArray(dataArray) || !dataArray.length) {
          chartDiv.innerText = "No data found.";
          return;
        }

        const labels = dataArray.map(row => row[0]);
        const values = dataArray.map(row => row[1]);

        chartDiv.innerHTML = '<canvas id="chartCanvas"></canvas>';
        const ctx = document.getElementById("chartCanvas").getContext("2d");

        if (chartInstance) chartInstance.destroy();

        chartInstance = new Chart(ctx, {
          type: "line",
          data: {
            labels,
            datasets: [
              {
                label: "Value",
                data: values,
                borderColor: "#0ea5e9",
                backgroundColor: "rgba(14,165,233,0.1)",
                fill: true,
                tension: 0.4,
              },
            ],
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            scales: {
              x: { grid: { color: "transparent" } },
              y: {
                grid: { color: "rgba(0,0,0,0.05)" },
                border: { color: "#ccc" },
              },
            },
            plugins: { legend: { display: false } },
          },
        });
      }

      function loadPrevYearChart() {
        google.script.run
        .withSuccessHandler(data => drawChart(data))
        .withFailureHandler(() => console.error("❌ Failed to load 2024 chart"))
        .getPrevYearMonthlyChartData();
      }

    </script>


    <style>
      body { font-family: system-ui, Arial, sans-serif; padding: 30px; background: #f8fafc; color: #334155; text-align: center; }
      h2 { margin-bottom: 20px; }
      #chart_div { width: 100%; height: 420px; background: white; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); padding: 10px; margin-bottom: 20px; text-align: center; }
      .btn-group { display: flex; justify-content: start; gap: 12px; }
      button { padding: 10px 16px; border: 0; background: #0ea5e9; color: white; border-radius: 6px; cursor: pointer; font-weight: 600; } 
      button:hover { background: #0284c7; }
      #loadPrevYear {font-size: 15px; margin-left: auto; cursor: pointer;}
      #loadPrevYear:hover {color: #0ea5e9;}
    </style>
  </head>
  <body>
    <h2 id="chartTitle">Performance Chart</h2>

    <div id="chart_div">Loading chart...</div>

    <div class="btn-group">
      <button onclick="loadChart('daily')">Daily</button>
      <button onclick="loadChart('monthly')">Monthly</button>
      <span onclick="loadPrevYearChart()" id="loadPrevYear"> → Show Previous Year Data</span>
    </div>
  </body>
</html>
