/* =========================================================
   01. FONTS
   ========================================================= */

@import url("https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap");


/* =========================================================
   02. THEME VARIABLES
   ========================================================= */

:root {
  /* Font Family */
  --font-primary:
    "Inter",
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;


  /* Primary Brand Colors */
  --gc-main-color: #008B8B;
  --gc-main-light: #D9EEEE;
  --gc-main-soft: #EBF6F6;
  --gc-main-dark: #006F6F;
  --gc-main-muted: #2B8285;
  --gc-main-subtle: #C0E9E9;


  /* Semantic Colors */
  --gc-primary: #0d6efd;
  --gc-alternate: #6f42c1;
  --gc-info: #0dcaf0;
  --gc-warning: #ffc107;
  --gc-danger: #dc3545;
  --gc-success: #198754;

  --gc-dark: #4B4B4D;
  --gc-dark-smooth: #767678;
  --gc-gray: #A2A2A4;
  --gc-light-smooth: #CECECF;
  --gc-light: #FAFAFA;


  /* Brand Interactive States */
  --gc-main-hover-bg: #007A7A;
  --gc-main-hover-border: #007272;
  --gc-main-active-bg: #007272;
  --gc-main-active-border: #006A6A;

  --gc-main-disabled-bg: #59B4B4;
  --gc-main-disabled-border: #73BFBF;

  --gc-main-outline-disabled-color: #66B9B9;
  --gc-main-outline-disabled-border: #80C5C5;

  --gc-main-focus-ring: rgba(0, 139, 139, 0.15);


  /* Text Colors */
  --gc-text-muted: #268386;
  --gc-text-light: #B3DCDC;
  --gc-text-dark: #006868;


  /* Brand Gradient Colors */
  --gc-grad-60: rgba(0, 139, 139, 0.6);
  --gc-grad-70: rgba(0, 139, 139, 0.7);
  --gc-grad-80: rgba(0, 139, 139, 0.8);
  --gc-grad-45: rgba(0, 139, 139, 0.45);
  --gc-grad-15: rgba(0, 139, 139, 0.15);
  --gc-grad-cool: rgba(6, 182, 212, 0.6);


  /* Animation & Skeleton Variables */
  --skeleton-base: #e5e7eb;
  --skeleton-highlight: #f3f4f6;
  --skeleton-duration: 1.2s;
  --fade-duration: 0.4s;

  /* Animation & Carousel Variables */
  --carousel-duration: 1s;
}


/* =========================================================
   03. BASE TYPOGRAPHY
   ========================================================= */

body {
  font-family: var(--font-primary);
  font-weight: 400;
  font-size: 14px;
  line-height: 1.5;
}

body h1,
body h2,
body h3,
body h4,
body h5,
body h6 {
  font-weight: 600;
}


/* =========================================================
   04. GLOBAL SCROLLBARS
   ========================================================= */

/* Firefox */
* {
  scrollbar-width: thin;
  scrollbar-color: #adb5bd #f1f3f5;
}

/* Chrome, Edge, Safari */
*::-webkit-scrollbar {
  width: 6px;
  height: 6px;
}

*::-webkit-scrollbar-track {
  background: #f1f3f5;
  border-radius: 4px;
}

*::-webkit-scrollbar-thumb {
  background: #adb5bd;
  border: 1px solid #f1f3f5;
  border-radius: 4px;
  transition:
    background 0.2s ease,
    width 0.2s ease,
    height 0.2s ease;
}

/* Expand scrollbars on hover or focus */
*:hover::-webkit-scrollbar,
*:focus-within::-webkit-scrollbar {
  width: 12px;
  height: 12px;
}

*:hover::-webkit-scrollbar-thumb,
*:focus-within::-webkit-scrollbar-thumb {
  background: #6c757d;
  border: 1px solid #e9ecef;
}

/* Firefox: Expand the page scrollbar on hover */
body:hover {
  scrollbar-width: auto;
  scrollbar-color: #6c757d #f1f3f5;
}


/* =========================================================
   05. TEXT SELECTION
   ========================================================= */

/* Default page selection */
::selection {
  background: var(--gc-main-color, #008B8B);
  color: #ffffff;
  text-shadow: none;
}

::-moz-selection {
  background: var(--gc-main-color, #008B8B);
  color: #ffffff;
  text-shadow: none;
}

/* Legacy WebKit selection selector */
::-webkit-selection {
  background: var(--gc-main-color, #008B8B);
  color: #ffffff;
  text-shadow: none;
}

/* Input and textarea selection */
input::selection,
textarea::selection {
  background: var(--gc-main-color, #008B8B);
  color: #ffffff;
  text-shadow: none;
}

input::-moz-selection,
textarea::-moz-selection {
  background: var(--gc-main-color, #008B8B);
  color: #ffffff;
  text-shadow: none;
}

input::-webkit-selection,
textarea::-webkit-selection {
  background: var(--gc-main-color, #008B8B);
  color: #ffffff;
  text-shadow: none;
}

/* Editable content selection */
[contenteditable]::selection,
[contenteditable]::-moz-selection,
[contenteditable]::-webkit-selection {
  background: var(--gc-main-color, #008B8B);
  color: #ffffff;
  text-shadow: none;
}


/* =========================================================
   06. GLOBAL BUTTON & DROPDOWN OVERRIDES
   ========================================================= */

/* Remove Bootstrap button focus/active shadows */
.btn-check:checked + .btn,
.btn.active,
.btn.show,
.btn:first-child:active,
:not(.btn-check) + .btn:active {
  box-shadow: none !important;
}

.btn:focus,
.btn:active,
.btn.focus,
.btn.active,
.btn:focus-visible,
.btn:active:focus,
button:focus,
button:active,
button.focus,
button.active,
button:focus-visible,
button:active:focus,
a.btn:focus,
a.btn:active,
a.btn.focus,
a.btn.active,
a.btn:focus-visible,
a.btn:active:focus {
  box-shadow: none !important;
}

/* Dropdown toggle reset */
a[data-bs-toggle="dropdown"] {
  outline: none !important;
  border: none !important;
  border-color: transparent !important;
}


/* =========================================================
   07. FORM CONTROLS
   ========================================================= */

/* Base input styling */
.form-control,
.form-select,
input[type="text"],
input[type="email"],
input[type="password"],
input[type="number"],
input[type="search"],
input[type="url"],
input[type="tel"],
textarea:not(.select2-search__field) {
  border: 1px solid #d1d5db;
  border-radius: 0.375rem;
  box-shadow: none;
  transition:
    border-color 180ms ease,
    box-shadow 180ms ease;
}

/* Focus state: brand-colored border and subtle ring */
.form-control:focus,
.form-select:focus,
input[type="text"]:focus,
input[type="email"]:focus,
input[type="password"]:focus,
input[type="number"]:focus,
input[type="search"]:focus,
input[type="url"]:focus,
input[type="tel"]:focus,
textarea:focus {
  border-color: var(--gc-main-color, #008B8B);
  outline: 2px solid transparent;
  box-shadow: 0 0 0 2px color-mix(
    in srgb,
    var(--gc-main-color, #008B8B),
    transparent,
    85%
  );
  background-color: #fff;
}

/* Disabled form controls */
input:disabled,
select:disabled,
textarea:disabled,
.form-control:disabled,
.form-select:disabled,
.custom-select:disabled,
.select2-container--disabled .select2-selection,
.select2-container--disabled .select2-selection--single,
.select2-container--disabled .select2-selection--multiple {
  background-color: #f8f9fa !important;
  border-color: #e9ecef !important;
  color: #adb5bd !important;
  cursor: not-allowed !important;
  opacity: 1 !important;
  box-shadow: none !important;
}

/* Disabled input placeholders */
input:disabled::placeholder,
textarea:disabled::placeholder {
  color: #ced4da !important;
}

/* Read-only inputs */
input[readonly],
textarea[readonly] {
  background-color: #ffffff !important;
  border-color: #ced4da !important;
  color: #495057 !important;
  cursor: default !important;
}


/* =========================================================
   08. SELECT2 OVERRIDES
   ========================================================= */

/* Disabled Select2 selection */
.select2-container--disabled .select2-selection {
  background-color: #f8f9fa !important;
  border-color: #e9ecef !important;
}

.select2-container--disabled .select2-selection__rendered {
  color: #adb5bd !important;
}

.select2-container--disabled .select2-selection__arrow b {
  border-color: #adb5bd transparent transparent transparent !important;
}


/* =========================================================
   09. GLOBAL THEME OVERRIDES
   ========================================================= */

/* Brand-colored text and navigation elements */
.card-header,
.card-title,
.nav-link,
.nav-link .nav-link-icon,
.nav-link:hover .nav-link-icon,
.card-header > .nav .nav-link.active,
.card-header > .nav .nav-link:hover,
.dropdown-menu .dropdown-header,
.app-sidebar__heading {
  color: var(--gc-main-color, #008B8B);
}

/* Brand-colored backgrounds and indicators */
.hamburger-inner,
.hamburger-inner:after,
.hamburger-inner:before,
.hamburger.is-active .hamburger-inner,
.hamburger.is-active .hamburger-inner:after,
.hamburger.is-active .hamburger-inner:before,
.dropdown-item.active,
.dropdown-item:active,
.tabs-animated .nav-link:before {
  background-color: var(--gc-main-color, #008B8B);
}

/* Search icon and button borders */
.search-wrapper .input-holder .search-icon span:after,
.btn-check:checked + .btn,
.btn.active,
.btn.show,
.btn:first-child:active,
:not(.btn-check) + .btn:active {
  border-color: var(--gc-main-color, #008B8B);
}

/* Search icon and tab indicator */
.search-wrapper .input-holder .search-icon span:before,
.card-header > .nav .nav-link:before {
  background: var(--gc-main-color, #008B8B);
}

/* Animated tab shadow */
.body-tabs-shadow .body-tabs-animated .nav-link:before {
  box-shadow:
    0 16px 26px -10px rgba(0, 139, 139, 0.56),
    0 4px 25px 0 rgba(0, 0, 0, 0.12),
    0 8px 10px -5px rgba(0, 139, 139, 0.2) !important;
}

/* Dropdown hover/focus */
.dropdown-item:focus,
.dropdown-item:hover {
  background-color: #fff;
  color: #008B8B;
}

/* Sidebar navigation and utility highlights */
.vertical-nav-menu li a.mm-active,
.vertical-nav-menu ul > li > a.mm-active,
.vertical-nav-menu ul > li > a:hover,
.input-group-text,
.btn-transition.btn-outline-link:hover,
.vertical-nav-menu li a:hover {
  background-color: #e9fbfa;
  color: #008B8B;
}


/* =========================================================
   10. CUSTOM GCB BUTTONS
   ========================================================= */

/* Solid button */
.btn-gc {
  color: #fff;
  background-color: var(--gc-main-color);
  border-color: var(--gc-main-color);
  box-shadow: none;
}

.btn-gc:hover {
  color: #fff;
  background-color: var(--gc-main-hover-bg);
  border-color: var(--gc-main-hover-border);
}

.btn-gc:focus,
.btn-gc.focus,
.btn-gc:focus-visible {
  color: #fff !important;
  background-color: var(--gc-main-color) !important;
  border-color: var(--gc-main-color) !important;
  box-shadow: 0 0 0 0.2rem var(--gc-main-focus-ring) !important;
}

.btn-gc:active,
.btn-gc.active,
.show > .btn-gc.dropdown-toggle {
  color: #fff !important;
  background-color: var(--gc-main-active-bg) !important;
  border-color: var(--gc-main-active-border) !important;
  box-shadow: none !important;
}

.btn-gc:disabled,
.btn-gc.disabled {
  color: #fff;
  background-color: var(--gc-main-disabled-bg);
  border-color: var(--gc-main-disabled-border);
  opacity: 0.65;
  box-shadow: none;
}


/* Outline button */
.btn-outline-gc {
  color: var(--gc-main-color);
  border-color: var(--gc-main-color);
  background: transparent;
  box-shadow: none;
}

.btn-outline-gc:hover {
  color: #fff;
  background-color: var(--gc-main-color);
  border-color: var(--gc-main-color);
  box-shadow: none;
}

.btn-outline-gc:focus,
.btn-outline-gc.focus,
.btn-outline-gc:focus-visible {
  color: #fff;
  background-color: var(--gc-main-color);
  border-color: var(--gc-main-color);
  box-shadow: 0 0 0 0.2rem var(--gc-main-focus-ring);
}

.btn-outline-gc:active,
.btn-outline-gc.active,
.show > .btn-outline-gc.dropdown-toggle {
  color: #fff;
  background-color: var(--gc-main-hover-bg);
  border-color: var(--gc-main-hover-border);
  box-shadow: none;
}

.btn-outline-gc:disabled,
.btn-outline-gc.disabled {
  color: var(--gc-main-outline-disabled-color);
  background-color: transparent;
  border-color: var(--gc-main-outline-disabled-border);
  opacity: 0.65;
  box-shadow: none;
}

/* =========================================================
   12. GCB GRADIENT UTILITIES
   ========================================================= */

.bg-gc-gradient {
  background: linear-gradient(
    90deg,
    var(--gc-main-color) 0%,
    var(--gc-grad-60) 100%
  ) !important;
}

.bg-gc-gradient-diag {
  background: linear-gradient(
    135deg,
    var(--gc-main-color) 0%,
    var(--gc-grad-70) 100%
  ) !important;
}

.bg-gc-gradient-warm {
  background: linear-gradient(
    135deg,
    var(--gc-main-color) 0%,
    var(--gc-grad-80) 100%
  ) !important;
}

.bg-gc-gradient-cool {
  background: linear-gradient(
    135deg,
    var(--gc-main-color) 0%,

  ) !important;
}

.bg-gc-gradient-deep {

    linear-gradient(

      rgba(0, 0, 0, 0.1) 0%,

    var(--gc-main-color) 0%,

  ) !important;
}

   ========================================================= */

   08. SELECT2 — DISABLED STATES
   ========================================================= */

}

}


/* =========================================================
   14. SELECT2 — BASE & SINGLE SELECT
   ========================================================= */

/* Container */

.select2.select2-container {
  width: 100%;
}

/* Shared selection surface */

.select2.select2-container .select2-selection {
  width: 100%;
  min-height: 43px !important;
  border: 1px solid #dce3eb;
  border-radius: 10px;
  outline: none !important;
  background: #fff;
  box-shadow: none;
  transition:
    border-color 0.18s ease,
    box-shadow 0.18s ease,
    background-color 0.18s ease;
}

/* Single selection */

.select2.select2-container
.select2-selection.select2-selection--single {
  height: 43px;
}

/* Selected text */

.select2.select2-container
.select2-selection--single
.select2-selection__rendered {
  padding-left: 0.8rem;
  padding-right: 2.5rem;
  color: #334155;
  font-size: 0.88rem;
  line-height: 41px;
}

/* Placeholder */

.select2-container--default
.select2-selection--single
.select2-selection__placeholder {
  color: #94a3b8;
}

/* Dropdown arrow area */

.select2.select2-container
.select2-selection--single
.select2-selection__arrow {
  top: 0;
  right: 0.4rem;
  width: 30px;
  height: 41px;
  border: 0;
  background: transparent;
}

/* Arrow */

.select2-container--default
.select2-selection--single
.select2-selection__arrow b {
  border-color: #94a3b8 transparent transparent transparent;
  border-width: 5px 4px 0;
  margin-left: -4px;
  margin-top: -2px;
  transition: transform 0.18s ease;
}

/* Open state */

.select2-container--default.select2-container--open
.select2-selection--single {
  border-color: #0d9488;
  box-shadow: 0 0 0 3px rgba(13, 148, 136, 0.12);
}

.select2-container--default.select2-container--open
.select2-selection--single
.select2-selection__arrow b {
  transform: rotate(180deg);
}

/* Focus state */

.select2-container--default.select2-container--focus
.select2-selection--single {
  border-color: #0d9488;
  box-shadow: 0 0 0 3px rgba(13, 148, 136, 0.12);
}


/* =========================================================
   15. SELECT2 — DROPDOWN & SEARCH
   ========================================================= */

/* Dropdown panel */

.select2-container .select2-dropdown {
  z-index: 1090;
  margin-top: 5px;
  padding: 5px;
  overflow: hidden;
  border: 1px solid #e2e8f0;
  border-radius: 12px;
  background: #fff;
  box-shadow: 0 12px 32px rgba(15, 23, 42, 0.14);
  font-size: 0.86rem;
}

/* Dropdown attached above selection */

.select2-container.select2-container--open
.select2-dropdown--above {
  margin-top: -5px;
}

/* Search wrapper */

.select2-container .select2-dropdown .select2-search {
  padding: 5px;
}

/* Search input */

.select2-container .select2-dropdown .select2-search input,
.select2-container .select2-dropdown .select2-search__field {
  width: 100%;
  min-height: 38px;
  padding: 0.55rem 0.75rem !important;
  border: 1px solid #e2e8f0 !important;
  border-radius: 8px;
  outline: none !important;
  background: #f8fafc;
  color: #334155;
  font-size: 0.84rem;
  box-shadow: none !important;
  transition:
    border-color 0.18s ease,
    background-color 0.18s ease,
    box-shadow 0.18s ease;
}

.select2-container .select2-dropdown .select2-search input:focus,
.select2-container .select2-dropdown .select2-search__field:focus {
  border-color: #0d9488 !important;
  background: #fff;
  box-shadow: 0 0 0 3px rgba(13, 148, 136, 0.1) !important;
}

/* Results container */

.select2-container .select2-dropdown .select2-results {
  padding: 3px;
  border: 0;
}

/* Scrollable results */

.select2-container .select2-dropdown
.select2-results > .select2-results__options {
  max-height: 240px;
  overflow-y: auto;
  padding: 2px;
}

/* Result options */

.select2-container--default .select2-results__option {
  margin: 2px 0;
  padding: 0.65rem 0.75rem;
  border-radius: 7px;
  color: #334155;
  font-size: 0.84rem;
  line-height: 1.4;
  transition:
    background-color 0.15s ease,
    color 0.15s ease;
}

/* Hover and keyboard highlight */

.select2-container--default
.select2-results__option--highlighted[aria-selected] {
  background: #e9fbf8 !important;
  color: #087f75 !important;
}

/* Selected result */

.select2-container--default
.select2-results__option--selected {
  background: #f0fdfa;
  color: #0f766e;
  font-weight: 650;
}

/* Selected result when highlighted */

.select2-container--default
.select2-results__option--selected.select2-results__option--highlighted {
  background: #d8f5ef !important;
  color: #0f766e !important;
}

/* Disabled result */

.select2-container--default
.select2-results__option--disabled {
  color: #94a3b8;
  cursor: not-allowed;
}

/* No-results message */

.select2-container--default
.select2-results__message {
  padding: 0.85rem;
  color: #94a3b8;
  font-size: 0.82rem;
  text-align: center;
}


/* =========================================================
   16. SELECT2 — MULTIPLE SELECT
   ========================================================= */

/* Multiple selection container */

.select2.select2-container
.select2-selection.select2-selection--multiple {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 5px;
  min-height: 45px !important;
  padding: 0.35rem 0.45rem;
  border: 1px solid #dce3eb;
  border-radius: 10px;
  background: #fff;
  box-shadow: none;
}

/* Selection list */

.select2-container--default
.select2-selection--multiple .select2-selection__rendered {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 5px;
  margin: 0;
  padding: 0;
  overflow: visible;
  list-style: none;
}

/* Selected tags */

.select2-container--default
.select2-selection--multiple .select2-selection__choice {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  max-width: 100%;
  margin: 0;
  padding: 0.3rem 0.55rem 0.3rem 1.05rem;
  border: 1px solid #ccece7;
  border-radius: 7px;
  background: #effaf8;
  color: #11675f;
  font-size: 0.78rem;
  line-height: 1.4;
  overflow-wrap: anywhere;
}

/* Tag removal button */

.select2-container--default
.select2-selection--multiple
.select2-selection__choice__remove {
  order: 2;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  margin: 4px 0 0 2px;
  padding: 0 2px 2px 2px;
  border: 0;
  border-radius: 4px;
  background: transparent;
  color: #0d9488;
  font-size: 1rem;
  font-weight: 500;
  line-height: 1;
  cursor: pointer;
  opacity: 0.75;
  transition:
    color 0.15s ease,
    background-color 0.15s ease,
    opacity 0.15s ease;
}

.select2-container--default
.select2-selection--multiple
.select2-selection__choice__remove:hover {
  background: rgba(13, 148, 136, 0.1);
  color: var(--gc-danger);
  opacity: 1;
}

/* Inline search */

.select2-container--default
.select2-selection--multiple .select2-search--inline {
  display: inline-flex;
  flex: 1 1 80px;
  min-width: 80px;
  margin: 0;
  padding: 0;
}

/* Inline search input */

.select2-container--default
.select2-selection--multiple
.select2-search--inline .select2-search__field {
  width: 100% !important;
  min-width: 60px;
  height: 29px;
  margin: 0;
  padding: 0.25rem 0.35rem;
  border: 0 !important;
  outline: none !important;
  background: transparent;
  color: #334155;
  font-size: 0.84rem;
  box-shadow: none !important;
}

/* Placeholder for multiple select */

.select2-container--default
.select2-selection--multiple
.select2-search--inline .select2-search__field::placeholder {
  color: #94a3b8;
  opacity: 1;
}


/* =========================================================
   17. SELECT2 — MULTIPLE SELECT RESULTS
   ========================================================= */

/* Inherit the same dropdown styling for single and multiple
   selects so both have a consistent appearance. */

.select2-container--default
.select2-dropdown .select2-results__option[aria-selected="true"] {
  background: #f0fdfa;
  color: #0f766e;
  font-weight: 600;
}

.select2-container--default
.select2-dropdown
.select2-results__option--highlighted[aria-selected="true"] {
  background: #d8f5ef !important;
  color: #0f766e !important;
}


/* =========================================================
   18. SELECT2 — FOCUS, DISABLED & RESPONSIVE STATES
   ========================================================= */

/* Focus state for multiple select */

.select2-container--default.select2-container--focus
.select2-selection--multiple,
.select2-container--default.select2-container--open
.select2-selection--multiple {
  border-color: #0d9488;
  outline: none;
  background: #fff;
  box-shadow: 0 0 0 3px rgba(13, 148, 136, 0.12);
}

/* Disabled multiple selection */

.select2-container--default
.select2-selection--multiple.is-disabled,
.select2-container--default
.select2-selection--multiple:disabled {
  border-color: #e2e8f0;
  background: #f8fafc;
  cursor: not-allowed;
  opacity: 0.8;
  box-shadow: none;
}

/* Disabled tags */

.select2-container--disabled
.select2-selection--multiple .select2-selection__choice {
  border-color: #e2e8f0;
  background: #f1f5f9;
  color: #94a3b8;
}

/* Disabled tag removal */

.select2-container--disabled
.select2-selection--multiple .select2-selection__choice__remove {
  display: none;
}

/* Disabled inline search */

.select2-container--disabled
.select2-selection--multiple
.select2-search--inline .select2-search__field {
  color: #94a3b8;
  cursor: not-allowed;
}

/* Mobile and narrow screens */

@media (max-width: 575.98px) {
  .select2-container .select2-dropdown {
    border-radius: 10px;
    box-shadow: 0 8px 24px rgba(15, 23, 42, 0.14);
  }

  .select2-container .select2-dropdown
  .select2-results > .select2-results__options {
    max-height: 200px;
  }

  .select2-container--default
  .select2-selection--multiple {
    gap: 4px;
  }

  .select2-container--default
  .select2-selection--multiple .select2-selection__choice {
    max-width: 100%;
    font-size: 0.76rem;
  }
}


/* =========================================================
   08. SELECT2 — DISABLED STATES
   ========================================================= */

.select2-container--disabled .select2-selection {
  background-color: #f8fafc !important;
  border-color: #e2e8f0 !important;
  cursor: not-allowed;
  opacity: 0.8;
}

.select2-container--disabled .select2-selection__rendered {
  color: #94a3b8 !important;
}

.select2-container--disabled .select2-selection__arrow b {
  border-color: #94a3b8 transparent transparent transparent !important;
}


/* =========================================================
   19. STANDARD FORM CONTROLS
   ========================================================= */

/* Generic input, select and textarea sizing */
input[type="text"],
input[type="number"],
select,
textarea:not(.select2-search__field) {
  width: 100%;
  min-height: 38px !important;
  padding: 10px 12px;
  border: 1px solid #e6e9ee;
  border-radius: 8px;
  font-size: 14px;
  outline: none;
}

textarea:not(.select2-search__field) {
  min-height: 3.5rem !important; 
  field-sizing: content; 
}

/* =========================================================
   20. CUSTOM SELECT
   ========================================================= */

.custom-select {
  display: inline-block;
  width: 100%;
  height: calc(1.5em + 0.75rem + 2px);
  padding: 0.375rem 2.25rem 0.375rem 0.75rem;
  line-height: 1.5;
  color: #495057;
  vertical-align: middle;

  background:
    #fff
    url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23343a40' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'/%3e%3c/svg%3e")
    no-repeat right 0.75rem center;
  background-size: 14px 14px;

  border: 1px solid #ced4da;
  border-radius: 0.25rem;
  box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.075);

  -webkit-appearance: none;
  -moz-appearance: none;
  appearance: none;

  transition:
    color 0.15s ease-in-out,
    background-color 0.15s ease-in-out,
    border-color 0.15s ease-in-out,
    box-shadow 0.15s ease-in-out;
}

/* Base focus and validation focus reset */
.custom-select:focus,
.custom-select:active,
.custom-select.is-valid:focus,
.custom-select.is-invalid:focus,
.was-validated .custom-select:valid:focus,
.was-validated .custom-select:invalid:focus {
  outline: none;
  box-shadow: none;
  border-color: #ced4da;
}

/* Optional subtle focus indicator */
.custom-select:focus {
  outline: none;
  box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.1);
  border-color: #adb5bd;
}

/* Legacy Microsoft select value styling */
.custom-select:focus::-ms-value {
  color: #495057;
  background-color: #fff;
}

/* Multiple / sized select */
.custom-select[multiple],
.custom-select[size]:not([size="1"]) {
  height: auto;
  padding-right: 0.75rem;
  background-image: none;
}

/* Disabled select */
.custom-select:disabled {
  color: #6c757d;
  background-color: #e9ecef;
}

/* Legacy Microsoft expand arrow */
.custom-select::-ms-expand {
  opacity: 0;
}


/* =========================================================
   21. CUSTOM SELECT — VALIDATION STATES
   ========================================================= */

/* Valid */
.was-validated .custom-select:valid,
.custom-select.is-valid {
  border-color: #28a745;
}

.was-validated .custom-select:valid:focus,
.custom-select.is-valid:focus {
  border-color: #28a745;
  box-shadow: 0 0 0 0.2rem rgba(40, 167, 69, 0.25);
}

.was-validated .custom-select:valid ~ .valid-feedback,
.was-validated .custom-select:valid ~ .valid-tooltip,
.custom-select.is-valid ~ .valid-feedback,
.custom-select.is-valid ~ .valid-tooltip {
  display: block;
}

/* Invalid */
.was-validated .custom-select:invalid,
.custom-select.is-invalid {
  border-color: var(--gc-danger);
}

.was-validated .custom-select:invalid:focus,
.custom-select.is-invalid:focus {
  border-color: var(--gc-danger);
  box-shadow: 0 0 0 0.2rem rgba(220, 53, 69, 0.25);
}

.was-validated .custom-select:invalid ~ .invalid-feedback,
.was-validated .custom-select:invalid ~ .invalid-tooltip,
.custom-select.is-invalid ~ .invalid-feedback,
.custom-select.is-invalid ~ .invalid-tooltip {
  display: block;
}


/* =========================================================
   22. VISIBILITY UTILITIES
   ========================================================= */

/* Visually hidden but accessible to screen readers */
.visually-hidden {
  border: 0;
  clip: rect(0, 0, 0, 0);
  height: 1px;
  margin: -1px;
  overflow: hidden;
  padding: 0;
  position: absolute;
  width: 1px;
  white-space: nowrap;
}

/* Removed from layout and accessibility tree */
.element-hidden {
  display: none !important;
}

/* =========================================================
   RESPONSIVE RULE — TEMPORARY LOCATION
   Move to the consolidated responsive section at final pass.
   ========================================================= */

@media (max-width: 767.98px) {
  .select2.select2-container
    .select2-selection.select2-selection--multiple,
  .select2.select2-container .select2-selection {
    height: auto !important;
  }
}


/* =========================================================
   23. DATATABLES — CORE TABLE STYLING
   ========================================================= */

.dataTable {
  margin: 15px 0;
}

.dataTable thead th {
  border: none;
  color: var(--gc-dark);
}

.dataTable tbody td {
  border-bottom: none !important;
  padding-top: 18px;
  padding-bottom: 18px;
  color: #69696B;
}

.dataTable tbody.simple td {
  padding-top: 0;
  padding-bottom: 0;
}

.dataTable .dt-center {
  text-align: center;
}

/* Column alignment */

table.dataTable th.dt-align-left,
table.dataTable td.dt-align-left,
.dt-align-left {
  text-align: left;
}

table.dataTable th.dt-align-center,
table.dataTable td.dt-align-center,
.dt-align-center {
  text-align: center;
}

table.dataTable th.dt-align-right,
table.dataTable td.dt-align-right,
.dt-align-right {
  text-align: right;
}

/* Column ordering */

table.dataTable thead > tr > th.dt-orderable-asc:hover,
table.dataTable thead > tr > th.dt-orderable-desc:hover,
table.dataTable thead > tr > td.dt-orderable-asc:hover,
table.dataTable thead > tr > td.dt-orderable-desc:hover {
  outline: none;
}

table.dataTable thead > tr > th.dt-ordering-desc .dt-column-order::after,
table.dataTable thead > tr > td.dt-ordering-desc .dt-column-order::after {
  border-top-color: var(--gc-main-color, #008B8B);
}

table.dataTable thead > tr > th.dt-ordering-asc .dt-column-order::before,
table.dataTable thead > tr > td.dt-ordering-asc .dt-column-order::before {
  border-bottom-color: var(--gc-main-color, #008B8B);
}

.dt-column-header .dt-column-order {
  opacity: 0;
}

.dt-column-header:hover .dt-column-order {
  opacity: 1;
}

/* Table content highlights */

.dataTable .highlight,
.dataTable .highlight-row td:first-child {
  font-weight: bold;
}

.dataTable .highlight-row td:first-child span {
  background: #f2f2f2;
  color: #0D0D0D;
  font-size: clamp(11px, 3vw, 12px);
  margin-right: 5px;
  padding: 3px 7px;
}


/* =========================================================
   24. DATATABLES — FORM CONTROLS
   ========================================================= */

/* DataTables page-length selector */

.dt-container .form-select {
  --bs-form-select-bg-img: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3e%3cpath fill='none' stroke='%23343a40' stroke-linecap='round' stroke-linejoin='round' stroke-width='2' d='m2 5 6 6 6-6'/%3e%3c/svg%3e");

  display: block;
  width: 100%;
  padding: 0.375rem 2.25rem 0.375rem 0.75rem;
  font-size: 0.875rem;
  font-weight: 400;
  line-height: 1.5;
  color: #212529;
  appearance: none;
  background-color: #fff;
  background-repeat: no-repeat;
  background-position: right 0.75rem center;
  background-size: 16px 12px;
  border: 1px solid #dee2e6;
  border-radius: 0.375rem;
  transition: border-color 0.15s ease-in-out, box-shadow 0.15s ease-in-out;
}

.dt-container .form-select:focus {
  border-color: #86b7fe;
  outline: 0;
  box-shadow: 0 0 0 0.25rem rgba(13, 110, 253, 0.25);
}


/* =========================================================
   25. DATATABLES — TABLE BORDERS AND SCROLL CONTAINERS
   ========================================================= */

/* Remove borders and shadows from DataTables */

table.dataTable,
table.dataTable thead th,
table.dataTable tbody td,
table.dataTable tbody tr,
.dt-table-overlay {
  border: 0 !important;
  box-shadow: none !important;
}

/* Remove Bootstrap table cell borders globally */

.table th,
.table td {
  border: 0 !important;
  box-shadow: none !important;
}

/* Remove borders around loader rows */

.dt-loader-row,
.dt-loader-row td {
  border: 0 !important;
  background: transparent !important;
}

/* Remove borders and outlines from DataTables scroll containers */

.dataTables_scroll,
.dataTables_scrollBody,
.dataTables_scrollHead,
.dataTables_scrollHeadInner,
.dt-scroll-body,
.dt-scroll-head {
  border: 0 !important;
  box-shadow: none !important;
  outline: none !important;
}


/* =========================================================
   26. DATATABLES — LOADER ROWS AND ANIMATED LOADERS
   ========================================================= */

/* Loader row */

table.table tbody .dt-loader-row td {
  position: relative;
  padding: 35px 0;
}

/* Base bar loader */

.bar-loader {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
}

.bar-loader span {
  width: 6px;
  height: 28px;
  background: var(--gc-main-color);
  animation: pulseChart 1s ease-in-out infinite;
}

.bar-loader span:nth-child(2) {
  animation-delay: 0.15s;
}

.bar-loader span:nth-child(3) {
  animation-delay: 0.3s;
}

/* Loader inside a table cell */

td .bar-loader {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  gap: 4px;
}

td .bar-loader span {
  width: 4px;
  height: 18px;
}

/* Loader inside the table overlay */

.dt-table-scroll-locked {
  min-height: 230px;
}

.dt-table-overlay .bar-loader {
  position: static;
  transform: none;
}

.dt-table-overlay .bar-loader span {
  width: 6px;
  height: 28px;
}

/* Table loading overlay */

.dt-table-overlay {
  position: absolute;
  inset: 0;
  z-index: 10;
  display: flex;
  align-items: center;
  justify-content: center;
  background-color: rgba(255, 255, 255, 0.75);
  backdrop-filter: blur(2px);
  border-radius: inherit;
}

.dt-table-overlay-content {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 0.75rem;
}

.dt-table-overlay-text {
  font-size: 0.875rem;
  color: #6c757d;
}

/* Loader animation */

@keyframes pulseChart {
  0%,
  100% {
    transform: scaleY(0.4);
    opacity: 0.5;
  }

  50% {
    transform: scaleY(1);
    opacity: 1;
  }
}


/* =========================================================
   27. DATATABLES — BUTTONS, PAGINATION, AND SEARCH
   ========================================================= */

/* DataTables export/action buttons */

.dt-buttons {
  margin-bottom: 15px;
}

/* Pagination */

.dt-paging {
  margin-top: 25px;
}

.dt-paging-button button {
  padding: 7px 15px;
  background: transparent !important;
  font-weight: 600;
  border: none;
}

.dt-paging-button:not(.active) button:not(.next):not(.previous) {
  color: #c2c2c2 !important;
}

.dt-paging-button.active button,
.dt-paging-button button.next,
.dt-paging-button button.previous {
  color: #6d7ae0 !important;
}

.dt-paging-button button.next,
.dt-paging-button button.previous {
  font-weight: 900;
}

.dt-paging-button.active button {
  font-weight: 600;
  text-decoration: underline;
  text-decoration-thickness: 3px;
  text-underline-offset: 4px;
}

.dt-paging-button button:hover {
  color: #6d7ae0 !important;
  text-decoration: underline;
  text-decoration-thickness: 3px;
  text-underline-offset: 4px;
}

/* Search field and icon */

.dt-search {
  position: relative;
  display: inline-flex;
  align-items: center;
}

.dt-search label {
  display: none;
}

.dt-search::after {
  content: "\f002";
  font-family: "Font Awesome 7 Free";
  font-weight: 900;
  position: absolute;
  right: 12px;
  color: #6c757d;
  pointer-events: none;
  opacity: 0.85;
}

.dt-search:hover::after {
  color: var(--gc-main-color);
  opacity: 1;
}

.dt-search input {
  width: 38px;
  height: 38px;
  padding-right: 34px;
  border-color: transparent;
  transition: width 0.25s ease;
}

.dt-search:hover input,
.dt-search input:focus {
  width: 220px;
}


/* =========================================================
   28. DATATABLES — LOADING INTERACTION LOCKS
   ========================================================= */

/* Disable table scrolling while loading */

.dt-table-scroll-locked,
.dt-table-scroll-locked .dataTables_scrollBody,
.dt-table-scroll-locked .dt-scroll-body,
.dt-table-scroll-locked .table-responsive {
  overflow: hidden !important;
}

/* Prevent table interaction while loading */

.dt-table-scroll-locked .dataTables_scrollBody,
.dt-table-scroll-locked .dt-scroll-body {
  pointer-events: none;
}

/* Optional page-scroll lock while the overlay is visible */

body.dt-table-overlay-open {
  overflow: hidden !important;
}


/* =========================================================
   29. TABLE — ROW HIGHLIGHTS AND HOVER STATES
   ========================================================= */

/* Highlighted row theme */

.table-row-highlighted {
  --bs-table-color: var(--gc-dark);
  --bs-table-border-color: #b6d4fe;
  --bs-table-bg: #e7f1ff;
  --bs-table-striped-bg: #dce9ff;
  --bs-table-striped-color: var(--gc-dark);
  --bs-table-active-bg: #cfe2ff;
  --bs-table-active-color: var(--gc-dark);
  --bs-table-hover-bg: #d6e4ff;
  --bs-table-hover-color: var(--gc-dark);

  color: var(--bs-table-color);
  border-color: var(--bs-table-border-color);
}

/* Smooth table row hover */

.table-hovered > tbody > tr {
  transition:
    background-color 0.25s ease,
    color 0.25s ease,
    font-weight 0.25s ease;
  background-color: #fafafa;
}

.table-hovered > tbody > tr:hover {
  background-color: #f8f8f8 !important;
}

.table-hovered > tbody > tr:hover td {
  color: var(--gc-main-color);
  font-weight: 600;
}

/* In case the framework applies hover styles to cells */

.table-hovered > tbody > tr:hover > td,
.table-hovered > tbody > tr:hover > th {
  background-color: #f8f8f8 !important;
  color: var(--gc-main-color);
  font-weight: 600;
}


/* =========================================================
   30. TABLE — ACTION BUTTONS AND ICONS
   ========================================================= */

/* Action button group */

.action-btn-group {
  text-align: center !important;
}

.action-btn-group button i,

.action-btn-group .view-hour-history i:hover,

.action-btn-group .view-client-details i:hover {

}

}

.action-btn-group i.open-client-btn:hover {

/* Report action buttons */

  align-items: center;
  justify-content: center; */

}

.btn-report-action i {

.badge-new-report:empty {

/* =========================================================
   31. DATATABLES — INLINE CHARTS
   ========================================================= */

.datatable--chart-cell {

}

  width: 100%;
  height: 90px;
  overflow: hidden;
}

.datatable--row-chart canvas {
  display: block;
  width: 100%;
  height: 100%;
}


/* =========================================================
   32. TABLE — CLIENT NAME DISPLAY VARIANTS
   ========================================================= */

.client-name-mobile {
  display: none;
}

.client-name-desktop {
  display: block;
}


/* =========================================================
   33. DATATABLES — MOBILE RESPONSIVE
   Breakpoint: 767.98px
   ========================================================= */

@media (max-width: 767.98px) {
  /* Responsive DataTables details */

  table.dataTable > tbody > tr.child ul.dtr-details > li span.dtr-data,
  table.dataTable > tbody > tr.child ul.dtr-details > li span.dtr-title {
    text-align: center;
  }

  /* Dashboard and waiting filters */

  #dashFilter,
  #waitingFilter {
    font-size: 10px;
  }

  #dashFilter span,
  #waitingFilter span {
    padding-bottom: 0;
  }

  /* Icons inside table buttons */

  tr td .btn i {
    font-weight: 900;
    font-size: 20px;
  }

  /* Font Awesome icon size override */

  tr td .btn i.fa,
  tr td .btn i.fas,
  tr td .btn i.far,
  tr td .btn i.fab,
  tr td .btn i.fal,
  tr td .btn i.fad {
    font-size: 18px;
  }

  /* Horizontally scrollable table wrapper */

  #table-wrapper {
    width: 100%;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
    -ms-overflow-style: none;
  }

  #table-wrapper::-webkit-scrollbar {
    display: none;
  }

  #table-wrapper table {
    min-width: 100%;
    border-collapse: collapse;
  }

  /* Switch client name variants */

  .client-name-desktop {
    display: none;
  }

  .client-name-mobile {
    display: inline-block;
    font-weight: 600;
    color: #343a40;
    white-space: nowrap;
  }

  .client-name-cell {
    text-align: left;
  }

  /* Remove DataTables layout padding on mobile */

  .dt-layout-full {
    padding: 0;
  }
}


/* =========================================================
   34. CHARTS — LOADING CONTAINER AND OVERLAY
   ========================================================= */

/* Chart loading container */

.chart-loading-container {
  position: relative;
  overflow: hidden;
  border-radius: 10px;
}

/* Loading overlay */

.chart-loading-overlay {
  position: absolute;
  inset: 0;
  z-index: 10;

  display: flex;
  align-items: center;
  justify-content: center;

  background: rgba(255, 255, 255, 0.2);
  backdrop-filter: blur(1px);
  -webkit-backdrop-filter: blur(1px);

  opacity: 1;
  transition:
    opacity 0.2s ease,
    backdrop-filter 0.2s ease;
}

/*
 * Preserve the existing visibility behavior.
 * Review the Bootstrap .d-none override before finalizing.
 */

.chart-loading-overlay.d-none {
  display: flex !important;
  opacity: 0;
  pointer-events: none;
}

/* Loading content panel */

.chart-loading-content {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;

  padding: 12px 18px;
  border-radius: 12px;

  background: rgba(255, 255, 255, 0.25);
  box-shadow:
    0 4px 20px rgba(0, 0, 0, 0.06),
    0 1px 4px rgba(0, 0, 0, 0.04);

  animation: chartLoadingFloat 1.8s ease-in-out infinite;
}

/* Spinner */

.chart-loading-spinner {
  width: 24px;
  height: 24px;

  border: 2px solid rgba(14, 165, 233, 0.15);
  border-top-color: var(--gc-main-color);
  border-radius: 50%;

  animation: chartLoadingSpin 0.8s linear infinite;
}

/* Loading text */

.chart-loading-text {
  font-size: 12px;
  font-weight: 500;
  color: #6b7280;
  letter-spacing: 0.01em;
}

/* Spinner animation */

@keyframes chartLoadingSpin {
  to {
    transform: rotate(360deg);
  }
}

/* Floating content animation */

@keyframes chartLoadingFloat {
  0%,
  100% {
    transform: translateY(0);
  }

  50% {
    transform: translateY(-2px);
  }
}


/* =========================================================
   35. CHARTS — HEADER AND FILTER CONTROLS
   ========================================================= */

.chart-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}

.chart-filter-control {
  height: 38px;
}

.chart-filter-month {
  width: 140px;
}

.chart-filter-year {
  width: 100px;
}

.chart-filter-submit {
  min-width: 90px;
}


/* =========================================================
   36. FLATPICKR — DATE PICKER STYLING
   ========================================================= */

/* Custom date input */

.custom-flatpickr {
  width: 220px;
  cursor: pointer;
  background-color: #fff;
  margin: 0 !important;
}

/* Calendar container */

.flatpickr-calendar {
  font-family: inherit;
  border-radius: 8px;
  border: 1px solid #e9ecef;
  box-shadow: 0 6px 20px rgba(0, 0, 0, 0.12);
}

/* Weekday header */

.flatpickr-weekdays {
  background: #f8f9fa;
}

/* Calendar day cells */

.flatpickr-day {
  border-radius: 6px;
  font-size: 12px;
}

.flatpickr-day.selected,
.flatpickr-day.startRange,
.flatpickr-day.endRange {
  border-radius: 6px;
}

/* Selected dates and range states */

.flatpickr-day.selected,
.flatpickr-day.startRange,
.flatpickr-day.endRange,
.flatpickr-day.selected.inRange,
.flatpickr-day.startRange.inRange,
.flatpickr-day.endRange.inRange,
.flatpickr-day.selected:focus,
.flatpickr-day.startRange:focus,
.flatpickr-day.endRange:focus,
.flatpickr-day.selected:hover,
.flatpickr-day.startRange:hover,
.flatpickr-day.endRange:hover,
.flatpickr-day.selected.prevMonthDay,
.flatpickr-day.startRange.prevMonthDay,
.flatpickr-day.endRange.prevMonthDay,
.flatpickr-day.selected.nextMonthDay,
.flatpickr-day.startRange.nextMonthDay,
.flatpickr-day.endRange.nextMonthDay {
  background: var(--gc-main-color, #008B8B);
  border-color: var(--gc-main-color, #008B8B);
}

/* Today's date hover and focus */

.flatpickr-day.today:hover,
.flatpickr-day.today:focus {
  border-color: var(--gc-main-color, #008B8B);
  background: var(--gc-main-color, #008B8B);
}

/* Month header */

.flatpickr-month .flatpickr-current-month {
  color: var(--gc-main-color, #008B8B);
}

.flatpickr-current-month span.cur-month {
  font-weight: 600;
  font-size: 18px;
}

/* Previous and next month navigation icons */

.flatpickr-months .flatpickr-prev-month:hover svg,
.flatpickr-months .flatpickr-next-month:hover svg {
  fill: var(--gc-main-color, #008B8B);
}


/* =========================================================
   37. CHARTS — MOBILE RESPONSIVE
   Breakpoint: 576px
   ========================================================= */

@media (max-width: 576px) {
  .chart-header {
    align-items: flex-start;
    flex-direction: column;
  }

  .chart-filters {
    width: 100%;
  }

  .chart-filter-month {
    flex: 1;
    width: auto;
  }

  .chart-filter-year {
    width: 100px;
  }

  .chart-filter-submit {
    min-width: 80px;
  }
}


/* =========================================================
   38. SCROLLBARS — HOVER-REVEALED SCROLLBARS
   ========================================================= */

/* Firefox: thin scrollbar with subtle colors */

.scrollbar-hover,
.dt-scroll-body {
  scrollbar-width: thin;
  scrollbar-color: rgba(108, 117, 125, 0.05) transparent;
  border: none !important;
}

/* Chrome, Edge, Safari: scrollbar dimensions */

.scrollbar-hover::-webkit-scrollbar,
.dt-scroll-body::-webkit-scrollbar {
  width: 6px;
  height: 6px;
}

/* Transparent scrollbar track */

.scrollbar-hover::-webkit-scrollbar-track,
.dt-scroll-body::-webkit-scrollbar-track {
  background: transparent;
}

/* Subtle scrollbar thumb */

.scrollbar-hover::-webkit-scrollbar-thumb,
.dt-scroll-body::-webkit-scrollbar-thumb {
  background-color: rgba(108, 117, 125, 0.05);
  border-radius: 999px;
  transition: background-color 250ms ease;
}

/* Stronger scrollbar colors on hover */

.scrollbar-hover:hover,
.dt-scroll-body:hover {
  scrollbar-color: #adb5bd transparent;
}

.scrollbar-hover:hover::-webkit-scrollbar-thumb,
.dt-scroll-body:hover::-webkit-scrollbar-thumb {
  background-color: #6c757d;
}


/* =========================================================
   39. SKELETON LOADING — STAGGERED CARDS
   ========================================================= */

/* Card loading state */

.card.stagger {
  position: relative;
  opacity: 0.3 !important;
  filter: blur(12px);
  transform: scale(0.96);
  transition:
    opacity 0.5s ease,
    filter 0.7s ease,
    transform 0.5s ease;
}

/* Shimmer overlay */

.card.stagger::before {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(
    100deg,
    transparent 30%,
    rgba(255, 255, 255, 0.06) 50%,
    transparent 70%
  );
  background-size: 200% 100%;
  animation: shimmer 1.2s infinite;
  border-radius: inherit;
  z-index: 1;
}

/* Loaded card state */

.card.stagger.loaded {
  opacity: 1;
  filter: blur(0);
  transform: scale(1);
}

.card.stagger.loaded::before {
  display: none;
}

/* Card shimmer animation */

@keyframes shimmer {
  0% {
    background-position: 200% 0;
  }

  100% {
    background-position: -200% 0;
  }
}


/* =========================================================
   40. SKELETON LOADING — GENERAL CONTENT TARGETS
   ========================================================= */

/* Base skeleton state */

.skeleton-target.skeleton {
  position: relative;
  overflow: hidden;
  background: var(--skeleton-base);
  color: transparent !important;
  pointer-events: none;
  user-select: none;
  box-shadow: none !important;
}

/* Hide child content while loading */

.skeleton-target.skeleton * {
  color: transparent !important;
  background: transparent !important;
  border-color: transparent !important;
  box-shadow: none !important;
}

/* Hide images and canvases while loading */

.skeleton-target.skeleton img,
.skeleton-target.skeleton canvas {
  opacity: 0 !important;
}

/* Skeleton shimmer overlay */

.skeleton-target.skeleton::after {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(
    90deg,
    transparent 0%,
    var(--skeleton-highlight) 50%,
    transparent 100%
  );
  background-size: 200% 100%;
  animation: skeleton-shimmer var(--skeleton-duration) infinite linear;
  z-index: 1;
}

/* Loaded state */

.skeleton-target.skeleton.loaded {
  background: transparent;
  color: inherit;
  pointer-events: auto;
  user-select: auto;
  box-shadow: revert !important;
  animation: skeleton-fade-in var(--fade-duration) ease forwards;
}

.skeleton-target.skeleton.loaded::after {
  display: none;
}

/* Restore child styling after loading */

.skeleton-target.skeleton.loaded * {
  color: inherit !important;
  background: inherit !important;
  border-color: inherit !important;
  box-shadow: revert !important;
}

/* Restore images and canvases */

.skeleton-target.skeleton.loaded img,
.skeleton-target.skeleton.loaded canvas {
  opacity: 1 !important;
}

/* General skeleton shimmer animation */

@keyframes skeleton-shimmer {
  0% {
    background-position: 200% 0;
  }

  100% {
    background-position: -200% 0;
  }
}

/* Fade-in animation after loading */

@keyframes skeleton-fade-in {
  from {
    opacity: 0;
  }

  to {
    opacity: 1;
  }
}


/* =========================================================
   41. ACCESSIBILITY — REDUCED MOTION
   ========================================================= */

@media (prefers-reduced-motion: reduce) {
  /* Staggered cards */

  .card.stagger {
    opacity: 1;
    filter: none;
    transform: none;
    transition: none;
  }

  .card.stagger::before {
    animation: none;
  }

  /* General skeleton targets */

  .skeleton-target.skeleton::after {
    animation: none;
  }
}


/* =========================================================
   42. DRAWER — CORE CONTAINER AND VISIBILITY
   ========================================================= */

.drawer {
  opacity: 0;
  box-sizing: border-box;
  position: fixed;
  z-index: 10;
  transition: transform 0.35s ease;
  backdrop-filter: blur(8px);
  background: rgba(255, 255, 255, 0.4);
  inset: 0;
}

/* Visible state */

.drawer.reg,
.drawer-open {
  opacity: 1;
}

/* Drawer content container */

.drawer .drawer-content {
  width: 90%;
  max-width: 1400px;
  margin: 0 auto;
  padding: 0;
  position: relative;
}


/* =========================================================
   43. DRAWER — POSITIONING, SIZING, AND OPEN STATES
   ========================================================= */

/* Top drawer */

.drawer-top {
  transform: translateY(-100%);
  inset: 0 0 auto 0;
  min-height: 350px;
}

/* Bottom drawer */

.drawer-bottom {
  transform: translateY(100%);
  inset: auto 0 0 0;
}

/* Open state */

.drawer-open.drawer-top,
.drawer-open.drawer-bottom {
  transform: translateY(0);
}

/* Boxed bottom drawer */

.drawer-open.drawer-bottom.drawer-boxed {
  transform: translate(-50%, 0) !important;
  left: 50%;
}

/* Bottom drawer sizing variants */

.drawer-open.drawer-bottom.drawer-sm {
  max-width: 500px;
}

.drawer-open.drawer-bottom.drawer-md {
  max-width: 700px;
}

.drawer-open.drawer-bottom.drawer-lg {
  max-width: 1200px;
}


/* =========================================================
   44. DRAWER — HEADER AND TITLE
   ========================================================= */

.drawer-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 16px;
  border-bottom: 1px solid rgba(0, 0, 0, 0.06);
  position: sticky;
  top: 0;
  z-index: 5;
  min-width: 0;
}

/* Header title */

.drawer-header .drawer-title {
  color: var(--gc-main-color);
  font-size: 0.88rem;
  font-weight: 700;
  text-transform: uppercase;
  margin: 0;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  display: flex;
  align-items: center;
  gap: 6px;
}

.drawer-header .drawer-title i {
  line-height: 1;
  flex-shrink: 0;
}


/* =========================================================
   45. DRAWER — HEADER ACTIONS
   ========================================================= */

.drawer-header .drawer-actions {
  display: flex;
  gap: 12px;
  align-items: center;
  flex: 0 0 auto;
  min-width: 64px;
}

/* Action buttons */

.drawer-header .drawer-actions button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 28px;
  padding: 4px 6px;
  background: transparent;
  border: none;
  cursor: pointer;
  opacity: 0.7;
  transition:
    opacity 0.2s ease,
    color 0.2s ease;
}

/* Action icons */

.drawer-header .drawer-actions button i {
  font-size: 24px;
  line-height: 1;
  display: inline-block;
}

/* Action hover states */

.drawer-header .drawer-actions button:hover {
  opacity: 1;
  color: #6d7ae0;
}


/* =========================================================
   46. DRAWER — BODY, MINIMIZED STATE, AND CLOSE BUTTON
   ========================================================= */

/* Bottom drawer body */

.drawer-bottom .drawer-body {
  padding: 16px;
}

/* Hide body when minimized */

.drawer-bottom.drawer-minimized .drawer-body {
  display: none;
}

.drawer-bottom.drawer-minimized .drawer-content {
  padding: 0 !important;
}

/* Minimized bottom drawer: retain header visibility */

.drawer-bottom.drawer-minimized {
  transform: translateY(calc(100% - 50px));
}

/* Legacy close button positioning */

.drawer-close {
  position: absolute;
  top: 8px;
  right: 12px;
  background: transparent;
  border: none;
  font-size: clamp(18px, 3vw, 20px);
  cursor: pointer;
  z-index: 20;
}

/* Close and minimize hover states */

.drawer-close:hover,
.drawer-minimize:hover {
  color: #000;
  font-weight: 900;
}


/* =========================================================
   47. DRAWER — INTERNAL CARD STYLING
   ========================================================= */

.drawer .card {
  background: rgba(255, 255, 255, 0.6) !important;
  padding: 15px;
}


/* =========================================================
   48. DRAWER — INLINE FORM GRIDS
   Grid variants: 4-column and 5-column layouts
   ========================================================= */

/* Form layout */

.drawer-bottom .drawer-grid-5 .form-inline,
.drawer-bottom .drawer-grid-4 .form-inline {
  display: flex;
  align-items: flex-end;
  gap: 1%;
  width: 100%;
}

/* Form groups */

.drawer-bottom .drawer-grid-5 .form-inline > .form-group,
.drawer-bottom .drawer-grid-4 .form-inline > .form-group {
  flex: 1 1 0;
  min-width: 0;
  margin-right: 0 !important;
}

/* Direct submit button fallback */

.drawer-bottom .drawer-grid-5 .form-inline > button:last-child,
.drawer-bottom .drawer-grid-4 .form-inline > button:last-child {
  flex: 0 0 6%;
  min-width: 80px;
}

/* Form controls and Select2 containers */

.drawer-bottom .drawer-grid-5 .form-inline .form-control,
.drawer-bottom .drawer-grid-4 .form-inline .form-control,
.drawer-bottom .drawer-grid-5 .form-inline .select2.select2-container,
.drawer-bottom .drawer-grid-4 .form-inline .select2.select2-container {
  width: 100%;
}

/* Auto-size the final form group */

.drawer-bottom .drawer-grid-5 .form-inline > .form-group:last-child,
.drawer-bottom .drawer-grid-4 .form-inline > .form-group:last-child {
  flex: 0 0 auto;
  width: auto;
  min-width: 0;
  margin-right: 0 !important;
}

/* Keep the button inside the final group at natural width */

.drawer-bottom .drawer-grid-5 .form-inline > .form-group:last-child > button,
.drawer-bottom .drawer-grid-4 .form-inline > .form-group:last-child > button {
  width: auto;
  white-space: nowrap;
}


/* =========================================================
   49. DRAWER — MOBILE RESPONSIVE
   Breakpoint: 767.98px
   ========================================================= */

@media (max-width: 767.98px) {
  /* Stack form groups vertically */

  .drawer-bottom .drawer-grid-5 .form-inline,
  .drawer-bottom .drawer-grid-4 .form-inline {
    flex-direction: column;
    align-items: stretch;
    gap: 15px;
  }

  /* Full-width form groups and direct buttons */

  .drawer-bottom .drawer-grid-5 .form-inline > .form-group:last-child,
  .drawer-bottom .drawer-grid-4 .form-inline > .form-group:last-child,
  .drawer-bottom .drawer-grid-5 .form-inline > .form-group,
  .drawer-bottom .drawer-grid-4 .form-inline > .form-group,
  .drawer-bottom .drawer-grid-5 .form-inline > button:last-child,
  .drawer-bottom .drawer-grid-4 .form-inline > button:last-child {
    width: 100%;
    flex: auto;
  }

  /* Full-width grouped buttons and drawer content */

  .drawer-bottom .drawer-grid-5 .form-inline > .form-group:last-child > button,
  .drawer-bottom .drawer-grid-4 .form-inline > .form-group:last-child > button,
  .drawer .drawer-content {
    width: 100%;
  }

  /* Mobile button padding for direct submit buttons */

  .drawer-bottom .drawer-grid-5 .form-inline > button:last-child,
  .drawer-bottom .drawer-grid-4 .form-inline > button:last-child {
    padding: 10px;
  }

  /* Expand sized bottom drawers to full width */

  .drawer-open.drawer-bottom.drawer-sm,
  .drawer-open.drawer-bottom.drawer-md,
  .drawer-open.drawer-bottom.drawer-lg {
    max-width: 100%;
    width: 100%;
  }
}



/* =========================================================
   42. MODALS — POSITIONING VARIANTS
   ========================================================= */

/* Top and bottom positioning */

.modal-top .modal-dialog {
  margin-top: 1rem;
}

.modal-bottom .modal-dialog {
  margin-top: auto;
  margin-bottom: 1rem;
}

/* Top-left and top-right positioning */

.modal-top-start .modal-dialog {
  margin-top: 1rem;
  margin-left: 1rem;
  margin-right: auto;
}

.modal-top-end .modal-dialog {
  margin-top: 1rem;
  margin-left: auto;
  margin-right: 1rem;
}

/* Bottom-left and bottom-right positioning */

.modal-bottom-start .modal-dialog {
  margin-top: auto;
  margin-bottom: 1rem;
  margin-left: 1rem;
  margin-right: auto;
}

.modal-bottom-end .modal-dialog {
  margin-top: auto;
  margin-bottom: 1rem;
  margin-left: auto;
  margin-right: 1rem;
}


/* =========================================================
   43. MODALS — DIALOG AND CONTENT
   ========================================================= */

/* Dialog */

.modal-dialog {
  box-shadow: none !important;
  filter: drop-shadow(0 24px 55px rgba(15, 23, 42, 0.16));
}

/* Modal surface */

.modal-content {
  border: 1px solid rgba(148, 163, 184, 0.16);
  border-radius: 20px;
  overflow: hidden;
  background: #fff;
  box-shadow: none;
}

/* =========================================================
   44. MODALS — HEADER, BODY, FOOTER
   ========================================================= */

/* Header */

.modal-content .modal-header {
  position: relative;
  padding: 1.4rem 1.5rem 1.1rem;
  background:
    radial-gradient(
      circle at 100% 0,
      rgba(13, 148, 136, 0.09),

    ),

/* Title */

  flex-wrap: wrap;
  gap: 0.65rem;
  padding: 1rem 1.5rem 1.25rem;
  background: #fff;
  border-top: 1px solid #edf0f4;
}

/* Footer action groups */

.modal-content .modal-footer > div {
  justify-content: flex-end;
  flex-wrap: wrap;
  gap: 0.65rem;
}

/* Modal buttons */

.modal-content .modal-footer .btn {
  min-width: 0;
  min-height: 42px;
  padding: 0.65rem 1rem;
  border-radius: 10px;
  font-size: 0.86rem;
  font-weight: 650;
  transition:
    background-color 0.18s ease,
    border-color 0.18s ease,
    box-shadow 0.18s ease,
    transform 0.18s ease;
}

.modal-content .modal-footer .btn:not(:disabled):active {
  transform: scale(0.98);

   ========================================================= */

  font-size: 0.84rem;
  font-weight: 650;
}

/* Inputs and native selects */

.modal-content .modal-body .form-control,
.modal-content .modal-body .custom-select,
.modal-content .modal-body .form-select {
  border: 1px solid #dce3eb;
  border-radius: 10px;
  background-color: #fff;

.modal-content .modal-body .custom-select,
.modal-content .modal-body .form-select {

/* Focus states */

  font-size: 0.78rem;

}

.modal-content .modal-body [id$="-review-body"] > p {
  margin-bottom: 1.2rem;

}

/* User identity / summary panel */

.modal-content .modal-body [id$="-review-content"] > .mb-3 {

.modal-content .modal-body [id$="-review-content"] > .mb-3 .small {

.modal-content .modal-body [id$="-review-content"] > .mb-3 strong {

}

/* Comparison table container */

.modal-content .modal-body [id$="-review-content"] .table-responsive {
  overflow-x: auto;
  border: 1px solid #e2e8f0;
  border-radius: 13px;
}

/* Comparison table */

.modal-content .modal-body [id$="-review-content"] .table {
  min-width: 390px;
  margin: 0;
  border: 0;
  font-size: 0.82rem;
}

.modal-content .modal-body [id$="-review-content"]
.table > :not(caption) > * > * {
  padding: 0.85rem 0.75rem;
  border-color: #edf0f4;
  vertical-align: top;
}

  background: #f8fafc;
  color: #64748b;
  font-size: 0.72rem;
  font-weight: 750;
  letter-spacing: 0.045em;
  text-transform: uppercase;
  white-space: nowrap;
}

.modal-content .modal-body [id$="-review-content"] .table tbody th {
  width: 25%;
  background: #fff;
  color: #475569;
  font-weight: 650;
}

.modal-content .modal-body [id$="-review-content"] .table tbody td {
  color: #334155;
  overflow-wrap: anywhere;
}

/* Capability badges */

.modal-content .modal-body [id$="-review-content"] .badge {
  display: inline-block;
  max-width: 100%;
  padding: 0.35rem 0.55rem;
  border-radius: 6px;
  font-size: 0.72rem;
  font-weight: 600;
  white-space: normal;
  overflow-wrap: anywhere;
}

.modal-content .modal-body [id$="-review-body"] .alert {
  padding: 0.85rem 1rem;
  border: 1px solid #f4dfaa;
  border-radius: 11px;
  background: #fffbeb;
  color: #854d0e;
  font-size: 0.81rem;
  line-height: 1.55;
}


/* =========================================================
   45. MODALS — TRANSITIONS AND ANIMATION
   ========================================================= */

.modal.fade .modal-dialog {
  transform: scale(0.95);
  transition: transform 0.25s ease-out;
}

.modal.show .modal-dialog {
  transform: scale(1);
}


/* =========================================================
   45.1 MODALS — RESPONSIVE
   ========================================================= */

@media (max-width: 575.98px) {
  .modal-dialog {
    margin: 0.6rem;
  }

  .modal-content {
    border-radius: 16px;
  }

  .modal-content .modal-header {
    padding: 1.1rem 1.1rem 0.9rem;
  }

  .modal-content .modal-body {
    padding: 1.1rem;
  }

  .modal-content .modal-footer {
    padding: 0.85rem 1.1rem 1.1rem;
  }

  .modal-content .modal-footer > div {
    gap: 0.5rem;
  }

  .modal-content .modal-footer .btn {
    flex: 1 1 auto;
    padding: 0.65rem 0.75rem;
  }

  .modal-content .modal-body [id$="-review-content"]
  .table > :not(caption) > * > * {
    padding: 0.7rem 0.6rem;
  }
}


/* =========================================================
   46. MODALS — CLOSE BUTTON
   ========================================================= */

.modal-content .btn-close {
  box-sizing: content-box;
  width: 1.5rem;
  height: 1.5rem;
  padding: 0.2rem;
  color: #0D0D0D;
  background:
    #f1f3f5
    url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3e%3cpath stroke='%23000' stroke-linecap='round' stroke-linejoin='round' stroke-width='2' d='M2 2l12 12M14 2L2 14'/%3e%3c/svg%3e")
    center/1em auto no-repeat;
  border: 0;
  border-radius: 50%;
  opacity: 1;
  transition: all 0.2s ease;
}

.modal-content .btn-close:hover {
  opacity: 0.75;
  background-color: #e9ecef;
  transform: rotate(90deg);
}

.modal-content .btn-close:focus {
  outline: 0;
  box-shadow: none;
}

/* Close button on dark modal surfaces */

.modal-content .btn-close-white {
  filter: invert(1) grayscale(100%) brightness(200%);
}


/* =========================================================
   52. GAP, DISPLAY & TYPOGRAPHY UTILITIES
   ========================================================= */

.gap-1 {
  gap: 0.25rem !important; /* 4px */
}

.gap-2 {
  gap: 0.5rem !important; /* 8px */
}

.gap-3 {
  gap: 1rem !important; /* 16px */
}

.d-grid {
  display: grid !important;
}

.font-size-sm {
  font-size: clamp(10px, 6vw, 12px);
}


/* =========================================================
   53. DASHBOARD THEME ACCENTS
   ========================================================= */

/* Focus */
.bg-focus-light {
  background-color: rgba(64, 70, 76, 0.08) !important;
}

.text-focus {
  color: #40464c !important;
}

.btn-outline-focus {
  color: #40464c;
  border-color: #40464c;
}

.btn-outline-focus:hover {
  background-color: #40464c;
  color: #fff;
}

/* Semantic light backgrounds */
.bg-primary-light {
  background-color: rgba(63, 106, 216, 0.08) !important;
}

.bg-success-light {
  background-color: rgba(58, 196, 125, 0.08) !important;
}

.bg-danger-light {
  background-color: rgba(220, 53, 69, 0.1) !important;
}

.bg-warning-light {
  background-color: rgba(247, 185, 36, 0.09) !important;
}


/* =========================================================
   54. SMALL COMPONENT UTILITIES
   ========================================================= */

/* Scrollable area */
.scroll-area-sm {
  height: 190px;
}

/* Avatar */
.avatar-circle.rounded-circle {
  width: 40px;
  height: 40px;
  font-weight: 600;
}

/* Status icons */
.status-icon-sm {
  padding: 3px;
}

.status-icon-sm i {
  font-size: 9px;
}


/* =========================================================
   55. COG & CHECK ICON STATES
   ========================================================= */

.cog-icon,
.check-icon {
  display: inline-block;
  vertical-align: middle;
  position: relative;
}

.cog-icon {
  top: -2px;
  color: #ffffffd9;
  animation: rotate 1s linear infinite;
}

.check-icon {
  top: -1px;
  color: inherit;
}

@keyframes rotate {
  from {
    transform: rotate(0deg);
  }

  to {
    transform: rotate(360deg);
  }
}


/* =========================================================
   56. APPLICATION LOADING STATE & CUSTOMIZATION
   ========================================================= */

.app-container.loading {
  display: none;
}

.app-header {
  transition:
    transform 0.25s ease,
    opacity 0.25s ease;
}

.app-header.app-header-hidden {
  transform: translateY(-100%);
  opacity: 0;
  pointer-events: none;
}


/* =========================================================
   57. INTERACTIVE ELEMENTS
   ========================================================= */

.app-sidebar__inner li a,
.logo-src {
  cursor: pointer;
}

.btn-link:hover i {
  color: var(--gc-main-color);
}


/* =========================================================
   58. MAIN LAYOUT CONSTRAINTS
   ========================================================= */

.app-main__outer {
  overflow-y: hidden;
}

#app-main-inner-container {
  margin-bottom: 60px;
}


/* =========================================================
   59. MOBILE FOOTER, CONTENT & NAVIGATION
   ========================================================= */

@media (max-width: 767.98px) {
  /* Fixed footer */
  .app-wrapper-footer {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    width: 100%;
    z-index: 1030;

    transition: opacity 0.25s ease, transform 0.25s ease;
    opacity: 1;
    transform: translateY(0);
  }

  /* Hidden footer state */
  .app-wrapper-footer.footer-hidden {
    opacity: 0;
    transform: translateY(100%);
    pointer-events: none;
  }

  /* Keep page content above the fixed footer */
  .app-main__inner {
    padding-bottom: 80px;
  }

  /* Horizontally scrollable tabs */
  .body-tabs.nav {
    display: flex;
    flex-wrap: nowrap;
    overflow-x: auto;
    white-space: nowrap;
  }

  .body-tabs.nav > li {
    float: none;
    display: inline-block;
  }
}


/* =========================================================
   60. GCB LOGIN SCREEN & CARD
   ========================================================= */

.gcb-login-screen {
  position: fixed;
  inset: 0;
  z-index: 99999;

  display: flex;
  align-items: center;
  justify-content: center;

  padding: 24px;

  background:
    radial-gradient(
      circle at top left,
      rgba(13, 110, 253, 0.08),
      transparent 35%
    ),
    #f8f9fa;
}

.gcb-login-card {
  width: 100%;
  max-width: 440px;

  background: #fff;

  border: 1px solid rgba(0, 0, 0, 0.06);
  border-radius: 18px;

  box-shadow: 0 20px 60px rgba(0, 0, 0, 0.08);

  overflow: hidden;
}


/* =========================================================
   61. LOGIN BRANDING & HEADER
   ========================================================= */

.gcb-login-brand {
  display: flex;
  align-items: center;
  gap: 14px;

  padding: 28px 28px 22px;

  border-bottom: 1px solid rgba(0, 0, 0, 0.06);
}

.gcb-login-logo {
  width: 46px;
  height: 46px;

  display: flex;
  align-items: center;
  justify-content: center;

  border-radius: 12px;

  background: var(--gc-main-light);
  color: var(--gc-main-color);

  font-size: 18px;
}

.gcb-login-title {
  font-size: 18px;
  font-weight: 700;
  color: #212529;
}

.gcb-login-subtitle {
  margin-top: 2px;

  font-size: 12px;
  color: #6c757d;
}


/* =========================================================
   62. LOGIN CONTENT & TYPOGRAPHY
   ========================================================= */

.gcb-login-content {
  padding: 32px 28px 28px;
}

.gcb-login-content h1 {
  margin: 0 0 8px;

  font-size: 28px;
  font-weight: 700;

  color: #212529;
}

.gcb-login-content p {
  margin: 0 0 26px;

  font-size: 14px;
  line-height: 1.6;

  color: #6c757d;
}


/* =========================================================
   63. GOOGLE LOGIN BUTTON
   ========================================================= */

.gcb-google-login-button {
  position: relative;

  width: 100%;
  min-height: 48px;

  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;

  border: 1px solid #dadce0;
  border-radius: 10px;

  background: #fff;
  color: #202124;

  font-size: 14px;
  font-weight: 600;

  cursor: pointer;

  transition:
    background-color 0.15s ease,
    box-shadow 0.15s ease,
    border-color 0.15s ease;
}

.gcb-google-login-button:hover {
  background: #f8f9fa;
  border-color: #c8cdd3;

  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
}

.gcb-google-login-button:disabled {
  cursor: not-allowed;
  opacity: 0.7;
}

.gcb-google-icon img {
  width: 22px;
  height: 22px;

  display: flex;
  align-items: center;
  justify-content: center;
}


/* =========================================================
   64. LOGIN ERROR & INFORMATION NOTE
   ========================================================= */

.gcb-login-error {
  margin-top: 16px;
  padding: 10px 12px;

  border-radius: 8px;

  background: #fff1f1;
  color: #b42318;

  font-size: 13px;
  line-height: 1.5;
}

.gcb-login-note {
  margin-top: 20px;

  text-align: center;

  font-size: 11px;
  line-height: 1.5;

  color: #98a2b3;
}


/* =========================================================
   65. LOGIN ACCOUNT HELP
   ========================================================= */

.gcb-login-account-help {
  margin-top: 18px;
  text-align: left;
}

.gcb-login-help-toggle {
  display: flex;
  align-items: center;
  justify-content: space-between;

  width: 100%;
  padding: 12px 0;

  border: 0;
  border-top: 1px solid #eaecf0;

  background: transparent;
  color: var(--gc-main-color);

  font-size: 13px;
  font-weight: 600;
  text-align: left;

  cursor: pointer;
}

.gcb-login-help-content {
  padding: 8px 12px 12px;

  border-radius: 8px;

  background: #f8fafc;
  color: #667085;

  font-size: 12px;
  line-height: 1.65;
}

.gcb-login-help-content ol {
  padding-left: 20px;
}

.gcb-login-help-content li {
  margin-bottom: 6px;
}

.gcb-login-help-content p {
  margin-bottom: 10px;
}


/* =========================================================
   66. LOGIN RESPONSIVE STYLES
   ========================================================= */

@media (max-width: 480px) {
  .gcb-login-screen {
    padding: 16px;
  }

  .gcb-login-brand {
    padding: 22px 20px 18px;
  }

  .gcb-login-content {
    padding: 26px 20px 22px;
  }

  .gcb-login-content h1 {
    font-size: 24px;
  }
}


/* =========================================================
   67. TODAY HOURS SUMMARY TOGGLE
   ========================================================= */

/* Visible by default */
#today-hours-summary {
  overflow: hidden;
  opacity: 1;
  max-height: 1000px;
  margin-bottom: 1rem !important;
  transform: translateY(0);

  transition:
    max-height 900ms ease,
    opacity 700ms ease,
    margin 900ms ease,
    transform 900ms ease;
}

/* Collapsing state (desktop only) */
@media (min-width: 768px) {
  #today-hours-summary.is-collapsing {
    opacity: 0;
    max-height: 0;
    margin-bottom: 0 !important;
    transform: translateY(-12px);
    pointer-events: none;
  }
}


/* =========================================================
   68. ACTIVE CLIENTS EXPANSION & COUNT
   ========================================================= */

#active-clients-list {
  max-height: 115px;
  overflow: hidden;

  transition:
    max-height 200ms ease,
    overflow 0s linear 650ms;
}

#active-clients-list.scrollable {
  max-height: 340px;
  overflow-y: auto;
}

.active-clients-count {
  cursor: pointer;
  user-select: none;
  transition: color 0.2s ease;
}

.active-clients-count:hover {
  color: var(--gc-main-color) !important;
}

.client-activity-active-client {
  margin-bottom: 1.6rem;
}


/* =========================================================
   69. RESPONSIVE DESKTOP & MOBILE ACTIONS
   ========================================================= */

/* Desktop default */
.responsive-mobile-actions {
  display: none;
}

@media (max-width: 767.98px) {
  .responsive-desktop-actions {
    display: none !important;
  }

  .responsive-mobile-actions {
    display: block;
  }

  .responsive-mobile-actions > .btn {
    width: 38px;
    height: 38px;
    padding: 0;

    display: flex;
    align-items: center;
    justify-content: center;
  }

  .responsive-mobile-actions .dropdown-menu {
    min-width: 190px;
  }

  .responsive-mobile-actions .dropdown-header {
    font-weight: 600;
  }
}


/* =========================================================
   70. PROGRESS BAR UTILITIES & ANIMATION
   ========================================================= */

.progress-bar {
  position: relative;
}

.progress.progress-bar-sm {
  height: 0.5rem;
}

.progress-bar-animated-alt.progress-bar::after,
.progress-bar-animated-alt .progress-bar::after {
  content: "";
  opacity: 0;

  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;

  background: #fff;

  animation: progress-active 2s ease infinite;
}

@keyframes progress-active {
  0% {
    opacity: 0.4;
    width: 0;
  }

  100% {
    opacity: 0;
    width: 100%;
  }
}


/* =========================================================
   71. DASHBOARD TOAST SIZING & APPEARANCE
   ========================================================= */

#dashboard-toast-container .toast {
  max-width: 280px;
  font-size: 0.8125rem; /* 13px */
}

#dashboard-toast-container .toast-header {
  padding: 0.35rem 0.6rem;
  font-size: 0.8125rem;
  background-color: #fff;
}

#dashboard-toast-container .toast-header .btn-close {
  width: 0.75rem;
  height: 0.75rem;
  padding: 0.25rem;
}

#dashboard-toast-container .toast-body {
  padding: 0.5rem 0.6rem;
  font-size: 0.8125rem;
}

#dashboard-toast-container .toast-body:not(.bg-warning) {
  color: #fff;
}

#dashboard-toast-container .toast-header i {
  font-size: 0.875rem;
}


/* =========================================================
   72. TODAY HOURS PENDING RECORD STATES
   ========================================================= */

.today-hours-record.record-pending-delete {
  opacity: 0.7;
  border-color: #dc3545 !important;
  background-color: #fff8f8;
}

.today-hours-record.record-pending-edit {
  border-color: #ffc107 !important;
  background-color: #fffdf5;

/* =========================================================

.project-list {

}

.client-item,
.project-item {

/* Name and metadata container */

.project-project {

}

.project-project-name {

}

.client-details-link:hover {
