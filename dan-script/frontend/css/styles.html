}


/* =========================================================
   88. APPLICATION PROFILE POPOVER CONTAINER
   ========================================================= */

.app-profile-popover {
  position: fixed;
  z-index: 1080;

  width: 280px;
  max-width: calc(100vw - 24px);

  background: #fff;
  border: 1px solid rgba(0, 0, 0, 0.08);
  border-radius: 12px;

  box-shadow:
    0 14px 35px rgba(0, 0, 0, 0.14),
    0 4px 10px rgba(0, 0, 0, 0.06);

  overflow: hidden;

  opacity: 0;
  visibility: hidden;
  pointer-events: none;

  transform: translateY(6px);

  transition:
    opacity 0.16s ease,
    transform 0.16s ease,
    visibility 0.16s ease;
}

.app-profile-popover.is-visible {
  opacity: 1;
  visibility: visible;
  pointer-events: auto;
  transform: translateY(0);
}


/* =========================================================
   89. PROFILE POPOVER BANNER & AVATAR
   ========================================================= */

.app-profile-popover-banner {
  position: relative;
  height: 90px;
  padding: 0 20px;
}

.app-profile-popover-banner-content {
  position: absolute;
  inset: 0;

  display: flex;
  align-items: center;
  justify-content: space-between;

  padding: 0 20px;
}

.app-profile-popover-avatar {
  width: 58px;
  height: 58px;
  flex: 0 0 58px;

  display: flex;
  align-items: center;
  justify-content: center;

  border-radius: 50%;

  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.14);

  color: #fff;
  font-size: 17px;
  font-weight: 700;
}

.app-profile-popover-profile-btn {
  border: 0;
  border-radius: 7px;

  font-size: 12px;
  font-weight: 600;
}


/* =========================================================
   90. PROFILE POPOVER BODY & IDENTITY
   ========================================================= */

.app-profile-popover-body {
  padding: 18px 20px 20px;
}

.app-profile-popover-name {
  margin: 0;

  font-size: 16px;
  font-weight: 600;
  line-height: 1.3;

  color: var(--gc-main-color);
}

.app-profile-popover-role {
  margin-top: 3px;

  font-size: 12px;
  color: #6c757d;
}


/* =========================================================
   91. PROFILE DETAILS GRID
   ========================================================= */

.app-profile-popover-details {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));

  gap: 14px 20px;
  margin-top: 18px;
}

.app-profile-popover-detail-label {
  margin-bottom: 2px;

  font-size: 10px;
  line-height: 1.2;

  text-transform: uppercase;
  letter-spacing: 0.05em;

  font-weight: 700;
  color: #adb5bd;
}

.app-profile-popover-detail-value {
  font-size: 13px;
  line-height: 1.3;

  font-weight: 600;
  color: #343a40;
}


/* =========================================================
   92. PROFILE CUSTOM CONTENT & FOOTER
   ========================================================= */

.app-profile-popover-divider {
  margin: 17px 0;
  border-top: 1px solid #f1f3f5;
}

.app-profile-popover-content {
  font-size: 13px;
}

.app-profile-popover-footer {
  padding: 14px 20px 18px;
  border-top: 1px solid #f1f3f5;
}


/* =========================================================
   93. PROFILE ACTION GRID & BUTTONS
   ========================================================= */

.app-profile-popover-actions {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 10px;
}

.app-profile-popover-actions
.app-profile-popover-action:first-child:active {
  border-color: transparent;
}

.app-profile-popover-action {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;

  gap: 7px;
  min-height: 72px;
  padding: 10px 8px;

  /* Original border and radius declarations are disabled.
     border: 1px solid #e9ecef;
     border-radius: 9px;
  */

  font-size: 11px;
  font-weight: 600;

  cursor: pointer;

  transition:
    background-color 0.15s ease,
    border-color 0.15s ease,
    transform 0.15s ease;
}

.app-profile-popover-action i {
  font-size: 20px;
  line-height: 1;
}

.app-profile-popover-action:hover {
  background: #f8f9fa;
  border-color: transparent;
}

.app-profile-popover-action:active {
  transform: translateY(1px);
}


/* =========================================================
   94. CLIENT PROFILE TRIGGERS & LOADING INDICATORS
   ========================================================= */

/* Profile interaction triggers */
.client-profile-trigger {
  cursor: pointer;
}

.client-action-name {
  position: relative;
  cursor: pointer;
}

/* Default client action icon */
.client-action-name::after {
  content: "\f007";
  font-family: "Font Awesome 7 Free";
  font-weight: 900;

  display: inline-block;
  position: relative;
  top: -1px;

  width: 0;
  margin-left: 0;

  opacity: 0;
  transform: translateX(-6px);

  overflow: hidden;
  vertical-align: middle;

  font-size: 11px;

  transition:
    width 0.18s ease,
    margin-left 0.18s ease,
    opacity 0.18s ease,
    transform 0.18s ease;
}

/* Profile-trigger icon */
.client-action-name.client-profile-trigger::after {
  content: "\f2c2";
}

/* Reveal icon on hover */
.client-action-name:hover::after {
  width: 15px;
  margin-left: 7px;

  opacity: 1;
  transform: translateX(0);
}

/* Client details loading indicator */
.client-details-loading {
  display: inline-flex;
  align-items: center;
  gap: 5px;

  font-size: 11px;
  font-weight: 400;
  color: #6c757d;

  vertical-align: middle;
}

.client-details-loading i {
  font-size: 10px;
}

/* Animated loading dots */
.loading-dots::after {
  content: "";
  display: inline-block;
  width: 12px;
  text-align: left;

  animation: loadingDots 1.4s steps(4, end) infinite;
}

@keyframes loadingDots {
  0% {
    content: "";
  }

  25% {
    content: ".";
  }

  50% {
    content: "..";
  }

  75%,
  100% {
    content: "...";
  }
}


/* =========================================================
   95. REQUEST MANAGER WIDGET & FLOATING TOGGLE
   ========================================================= */

#gcb-request-widget {
  position: fixed;
  right: 24px;
  bottom: 24px;
  z-index: 1080;
  font-size: 14px;
}

/* Request Manager: visibility transition */
#gcb-request-widget {
  transition:
    opacity 0.25s ease,
    transform 0.25s ease;
}

/* Request Manager: new-request animation */
#gcb-request-toggle.gcb-request-pulse {
  animation: gcb-request-pulse 0.75s ease-in-out;
}

@keyframes gcb-request-pulse {
  0%,
  100% {
    transform: translateY(0);
  }

  25% {
    transform: translateY(-6px);
  }

  50% {
    transform: translateY(2px);
  }

  75% {
    transform: translateY(-3px);
  }
}

/* Mobile-only auto-hide */
@media (max-width: 768px) {
  #gcb-request-widget.gcb-request-auto-hidden {
    opacity: 0;
    transform: translateY(24px);
    pointer-events: none;
  }
}

/* Respect reduced-motion preferences */
@media (prefers-reduced-motion: reduce) {
  #gcb-request-widget,
  #gcb-request-toggle.gcb-request-pulse {
    animation: none;
    transition: none;
  }
}

.gcb-request-toggle {
  position: relative;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 14px 12px;

  border: 1px solid var(--gc-light);
  border-radius: 28px;

  background: var(--gc-main-color);
  color: var(--gc-light);

  box-shadow: 0 4px 16px rgb(0 0 0 / 18%);

  cursor: pointer;

  transition:
    background-color 0.3s ease,
    color 0.3s ease,
    box-shadow 0.3s ease,
    transform 0.2s ease;
}

.gcb-request-icon {
  position: relative;

  display: inline-flex;
  align-items: center;
  justify-content: center;

  font-size: 22px;

  transition:
    transform 0.3s ease,
    color 0.3s ease;
}

/* Request count badge */
.gcb-request-count {
  position: absolute;
  top: -2px;
  right: -2px;
  z-index: 2;

  display: inline-flex;
  align-items: center;
  justify-content: center;

  min-width: 20px;
  height: 20px;
  padding: 0 6px;

  border: 1px solid var(--gc-main-subtle);
  border-radius: 12px;

  background: var(--gc-main-color);
  color: var(--gc-main-subtle);

  font-size: 10px;
  font-weight: 600;
  line-height: 1;

  transition:
    transform 0.3s ease,
    background-color 0.3s ease,
    color 0.3s ease;
}

.gcb-request-toggle > span {
  font-weight: 600;
}

/* Collapsed label */
.gcb-request-toggle > span:not(.gcb-request-icon):not(.gcb-request-count) {
  max-width: 0;
  margin-right: -10px;

  overflow: hidden;
  opacity: 0;
  white-space: nowrap;

  transition:
    max-width 0.35s cubic-bezier(0.4, 0, 0.2, 1),
    opacity 0.3s ease,
    margin 0.35s cubic-bezier(0.4, 0, 0.2, 1),
    padding 0.35s ease;
}

/* Hover interactions */
.gcb-request-toggle:hover {
  background: var(--gc-light);
  color: var(--gc-main-color);

  box-shadow: 0 6px 20px rgb(0 0 0 / 16%);
  transform: translateY(-2px);
}

.gcb-request-toggle:hover > span:not(.gcb-request-icon):not(.gcb-request-count) {
  max-width: 120px;
  margin-right: 0;
  padding-right: 10px;
  opacity: 1;
}

.gcb-request-toggle:hover .gcb-request-icon {
  color: var(--gc-main-color);
  transform: scale(1.08);
}

.gcb-request-toggle:hover .gcb-request-count {
  transform: scale(1.05);
}

/* Pressed and keyboard-focus states */
.gcb-request-toggle:active {
  transform: translateY(0);
  box-shadow: 0 3px 12px rgb(0 0 0 / 18%);
}

.gcb-request-toggle:focus-visible {
  outline: 2px solid var(--gc-main-color);
  outline-offset: 2px;
}


/* =========================================================
   96. REQUEST MANAGER PANEL & HEADER
   ========================================================= */

.gcb-request-panel {
  position: absolute;
  right: 0;
  bottom: 58px;

  display: flex;
  flex-direction: column;

  width: min(380px, calc(100vw - 32px));
  max-height: min(520px, calc(100vh - 120px));

  overflow: hidden;

  border: 1px solid #dee2e6;
  border-radius: 12px;

  background: #fff;
  color: #212529;

  box-shadow: 0 8px 32px rgb(0 0 0 / 18%);
}

.gcb-request-panel[hidden] {
  display: none;
}

.gcb-request-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;

  padding: 16px;

  border-bottom: 1px solid #dee2e6;
}

.gcb-request-subtitle {
  margin-top: 4px;
  color: #6c757d;
  font-size: 12px;
}

#gcb-request-close {
  border: 0;
  background: transparent;
  color: inherit;

  font-size: 24px;
  cursor: pointer;
}

.gcb-request-header-actions,
.gcb-request-actions {
  display: flex;
  align-items: center;
  gap: 8px;
}

.gcb-request-header-actions button,
.gcb-request-actions button:not(.dropdown-item) {
  padding: 5px 8px;
