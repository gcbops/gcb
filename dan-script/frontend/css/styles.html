/* ===== Custom Scrollbar (thin by default, normal on hover) ===== */

/* Firefox */
* {
  scrollbar-width: thin;
  scrollbar-color: #adb5bd #f1f3f5; /* thumb | track */
}

/* Chrome, Edge, Safari */
*::-webkit-scrollbar {
  width: 6px;   /* thin vertical scrollbar */
  height: 6px;  /* thin horizontal scrollbar */
}

*::-webkit-scrollbar-track {
  background: #f1f3f5; /* light track */
  border-radius: 4px;
}

*::-webkit-scrollbar-thumb {
  background: #adb5bd; /* grayish thumb */
  border-radius: 4px;
  border: 1px solid #f1f3f5; /* subtle padding effect */
  transition: background 0.2s ease, width 0.2s ease, height 0.2s ease;
}

/* On hover/focus anywhere, make scrollbars “normal” thickness and a bit darker */
*:hover::-webkit-scrollbar,
*:focus-within::-webkit-scrollbar {
  width: 12px;
  height: 12px;
}

*:hover::-webkit-scrollbar-thumb,
*:focus-within::-webkit-scrollbar-thumb {
  background: #6c757d; /* darker gray on hover */
  border: 1px solid #e9ecef;
}

/* Override default blue highlight (selection) on html/body with --gc-primary-color */

  text-shadow: none;
}

::-moz-selection {
  background: var(--gc-primary-color, #008B8B);

}

/* Webkit-based browsers (older Safari/Chrome) */
::-webkit-selection {

  color: #ffffff;
  text-shadow: none;
}

/* Input/textarea selection */

textarea::selection {

  color: #ffffff;
  text-shadow: none;
}

input::-moz-selection,

/* 
What you'll see:

Skeleton shimmer — each element shows a subtle moving gradient (like a loading placeholder)
Blur → sharp — filter: blur(12px) transitions to blur(0) as it "materializes"
Scale pop — slight scale(0.96) → scale(1) for a "settling in" feel
Staggered — each element loads 350 ms after the previous one
Tweak knobs:

Value	Effect
blur(12px)	Higher = more dramatic blur-to-sharp
stagger = 350	Time between each element appearing
400 (initial delay)	How long the first "skeleton" state shows
shimmer animation duration	Speed of the loading shimmer
scale(0.96)	Remove or change for a different entrance feel 

*/
.card.stagger {
  position: relative;
  opacity: 0;
  filter: blur(12px);
  transform: scale(0.96);
  transition: opacity 0.5s ease, filter 0.7s ease, transform 0.5s ease;
}

/* Shimmer overlay visible during "loading" */
.card.stagger::before {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(
    100deg,
    transparent 30%,
    rgba(255,255,255,0.06) 50%,
    transparent 70%
  );
  background-size: 200% 100%;
  animation: shimmer 1.2s infinite;
  border-radius: inherit;
  z-index: 1;
}

@media (prefers-reduced-motion: reduce) {
  .card.stagger {
    opacity: 1;
    filter: none;
    transform: none;
    transition: none;
  }

  .card.stagger::before {
    animation: none;
  }
}

/* --- LOADED STATE --- */
.card.stagger.loaded {
  opacity: 1;
  filter: blur(0);
  transform: scale(1);
}

.card.stagger.loaded::before {
  display: none;
}

@keyframes shimmer {
  0%   { background-position: 200% 0; }
  100% { background-position: -200% 0; }
}

/* --- Core Drawer Styles --- */
.drawer {
  opacity: 0;
  box-sizing: border-box;
  position: fixed;
  z-index: 10;
  transition: transform 0.35s ease;
  backdrop-filter: blur(8px);
  background: rgba(255, 255, 255, 0.4);
  inset: 0 0 0 0; /* cover full viewport for positioning */
}

/* Visible state */
.drawer.reg,
.drawer-open {
  opacity: 1;
}

/* Content container */
.drawer .drawer-content {
  width: 90%;
  max-width: 1400px;
  margin: 0 auto;
  padding: 0; /* let header/body handle padding */
  position: relative;
}

/* --- Positioning & States --- */
.drawer-top {
  transform: translateY(-100%);
  inset: 0 0 auto 0; /* top: 0 */
}

.drawer-bottom {
  transform: translateY(100%);
  inset: auto 0 0 0; /* bottom: 0 */
}

/* Open state (critical) */
.drawer-open.drawer-top,
.drawer-open.drawer-bottom {
  transform: translateY(0);
}

/* --- Sizing Variants (Bottom Only) --- */
.drawer-open.drawer-bottom.drawer-boxed {
  transform: translate(-50%, 0) !important;
  left: 50%;
}

.drawer-open.drawer-bottom.drawer-sm { max-width: 500px; }
.drawer-open.drawer-bottom.drawer-md { max-width: 700px; }
.drawer-open.drawer-bottom.drawer-lg { max-width: 1200px; }

/* --- Header (for minimize feature) --- */
.drawer-header {
  display: flex;
  align-items: center;        /* vertical center for title + actions */
  justify-content: space-between;
  padding: 10px 16px;
  border-bottom: 1px solid rgba(0,0,0,0.06);
  cursor: pointer;
  position: sticky;
  top: 0;
  z-index: 5;
  min-width: 0;
}

  flex-shrink: 0;
}

  font-size: .88rem;
  font-weight: 700;
  text-transform: uppercase;

  margin: 0;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;

}

  display: flex;
  gap: 12px;
  align-items: center;        /* vertical alignment */
  flex: 0 0 auto;
  min-width: 64px;
}

  align-items: center;        /* center icon inside button */

  min-width: 28px;

/* Container */

}

  border: 1px solid #ced4da;

  box-shadow: 0 2px 8px rgba(0,0,0,.1);
  margin-top: 4px;

/* Dropdown options */

  padding: 6px 10px;
  font-size: 14px;

}

/* Hover / keyboard highlight */
.select2-container--default .select2-results__option--highlighted[aria-selected] {

}

/* Selected option in dropdown */

/* Disabled state */
.select2-container--default .select2-selection--multiple.is-disabled,

/* Remove blue box-shadow on focus for Select2 multiple */
.select2-container--default.select2-container--focus .select2-selection--multiple,
.select2-container--default .select2-selection--multiple:focus,
.select2-container--default .select2-selection--multiple:active {
