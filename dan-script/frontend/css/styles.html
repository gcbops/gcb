/* 
What you'll see:

Skeleton shimmer — each element shows a subtle moving gradient (like a loading placeholder)
Blur → sharp — filter: blur(12px) transitions to blur(0) as it "materializes"
Scale pop — slight scale(0.96) → scale(1) for a "settling in" feel
Staggered — each element loads 350 ms after the previous one
Tweak knobs:

Value	Effect
blur(12px)	Higher = more dramatic blur-to-sharp
stagger = 350	Time between each element appearing
400 (initial delay)	How long the first "skeleton" state shows
shimmer animation duration	Speed of the loading shimmer
scale(0.96)	Remove or change for a different entrance feel 

*/
.card.stagger {
  position: relative;
  opacity: 0;
  filter: blur(12px);
  transform: scale(0.96);
  transition: opacity 0.5s ease, filter 0.7s ease, transform 0.5s ease;
}

/* Shimmer overlay visible during "loading" */
.card.stagger::before {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(
    100deg,
    transparent 30%,
    rgba(255,255,255,0.06) 50%,
    transparent 70%
  );
  background-size: 200% 100%;
  animation: shimmer 1.2s infinite;
  border-radius: inherit;
  z-index: 1;
}

@media (prefers-reduced-motion: reduce) {
  .card.stagger {
    opacity: 1;
    filter: none;
    transform: none;
    transition: none;
  }

  .card.stagger::before {
    animation: none;
  }
}

/* --- LOADED STATE --- */
.card.stagger.loaded {
  opacity: 1;
  filter: blur(0);
  transform: scale(1);
}

.card.stagger.loaded::before {
  display: none;
}

@keyframes shimmer {
  0%   { background-position: 200% 0; }
  100% { background-position: -200% 0; }
}
