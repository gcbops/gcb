
<div class="row">
    <div class="col-md-6 col-xl-4">
        <div class="card mb-3 widget-content">
            <div class="widget-content-outer">
                <div class="widget-content-wrapper">
                    <div class="widget-content-left">
                        <div class="widget-heading">Daily Grind</div>
                        <div class="widget-subheading">Total Hours Today</div>
                    </div>
                    <div class="widget-content-right">
                        <div class="widget-numbers text-info" id="daily-hour-total">0</div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="col-md-6 col-xl-4">
        <div class="card mb-3 widget-content">
            <div class="widget-content-outer">
                <div class="widget-content-wrapper">
                    <div class="widget-content-left">
                        <div class="widget-heading">Monthly Grind</div>
                        <div class="widget-subheading">Total Hours This Month</div>
                    </div>
                    <div class="widget-content-right">
                        <div class="widget-numbers text-info" id="monthly-hour-total">0</div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="col-md-6 col-xl-4">
        <div class="card mb-3 widget-content">
            <div class="widget-content-outer">
                <div class="widget-content-wrapper">
                    <div class="widget-content-left">
                        <div class="widget-heading">Yearly Grind</div>
                        <div class="widget-subheading">Total Hours This Year</div>
                    </div>
                    <div class="widget-content-right">
                        <div class="widget-numbers text-info"  id="yearly-hour-total">0</div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<div class="row">
  <div class="col-lg-12">
      <div class="main-card mb-3 card">
          <div class="card-body">
            <div style="display:flex; align-items:flex-start; gap:12px; margin-bottom: 10px;">
              <h5 class="card-title">Activity table</h5>
              <div style="flex:1"></div>
              <button class="mb-2 me-2 btn btn-info not-done-div" id="dashFilter">Pending<span class="badge rounded-pill bg-light text-dark not-done-text">0</span></button>
              <button class="mb-2 me-2 btn btn-success special-div" id="waitingFilter">Waiting<span class="badge rounded-pill bg-light text-dark special-count">0</span></button>
              <button type="button" class="btn btn-primary" id="selectClient-a-m"><i class="fa fa-plus"></i></button>
            </div>
              <div id="container" class="mt-4">
                <table id="table" class="table nowrap" style="width:100%">
                  <thead class="thead-blue thead-center">
                    <tr>
                      <th data-dt-column="0" rowspan="1" colspan="1" class="dt-orderable-asc dt-orderable-desc dt-ordering-asc" aria-sort="ascending">
                        <div class="dt-column-header">
                          <span class="dt-column-title">Client</span>
                          <span class="dt-column-order" role="button" aria-label="Client: Activate to invert sorting" tabindex="0"></span>
                        </div>
                      </th>
                      <th data-dt-column="1" rowspan="1" colspan="1" class="dt-orderable-asc dt-orderable-desc">
                        <div class="dt-column-header">
                          <span class="dt-column-title">Status</span>
                          <span class="dt-column-order" role="button" aria-label="Status: Activate to sort" tabindex="0"></span>
                        </div>
                      </th>
                      <th data-dt-column="2" rowspan="1" colspan="1" class="dt-orderable-asc dt-orderable-desc">
                        <div class="dt-column-header">
                          <span class="dt-column-title">Member</span>
                          <span class="dt-column-order" role="button" aria-label="Member: Activate to sort" tabindex="0"></span>
                        </div>
                      </th>
                      <th data-dt-column="3" rowspan="1" colspan="1" class="dt-orderable-asc dt-orderable-desc">
                        <div class="dt-column-header">
                          <span class="dt-column-title">Work Hour</span>
                          <span class="dt-column-order" role="button" aria-label="Work Hour: Activate to sort" tabindex="0"></span>
                        </div>
                      </th>
                      <th data-dt-column="4" rowspan="1" colspan="1" class="dt-orderable-asc dt-orderable-desc">
                        <div class="dt-column-header">
                          <span class="dt-column-title">Charged Hour</span>
                          <span class="dt-column-order" role="button" aria-label="Charged Hour: Activate to sort" tabindex="0"></span>
                        </div>
                      </th>
                      <th data-dt-column="5" rowspan="1" colspan="1" class="dt-orderable-asc dt-orderable-desc">
                        <div class="dt-column-header">
                          <span class="dt-column-title">Report Stat</span>
                          <span class="dt-column-order" role="button" aria-label="Report Stat: Activate to sort" tabindex="0"></span>
                        </div>
                      </th>
                      <th data-dt-column="6" rowspan="1" colspan="1" class="dt-orderable-asc dt-orderable-desc thead-center">
                        <div class="dt-column-header">
                          <span class="dt-column-title">Action</span>
                          <span class="dt-column-order" role="button" aria-label="Acrion: Activate to sort" tabindex="0"></span>
                        </div>
                      </th>
                    </tr>
                  </thead>
                  <tbody id="dataTableBody"></tbody>
                </table>
              </div>
          </div>
      </div>
  </div>
</div>
