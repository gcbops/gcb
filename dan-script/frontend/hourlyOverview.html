<div class="main-card mb-3 p-2 card">
    <div id="chart-hourly" style="height:500px;">
        <div class="bar-loader">
            <span></span><span></span><span></span>
        </div>
    </div>
</div>
<div class="row mb-3">
    <div class="col-md-6">
        <div class="main-card card">
            <div class="card-body">
                <div class="card my-4 widget-content bg-premium-dark">
                    <div class="widget-content-wrapper text-white">
                        <div class="widget-content-left">
                            <div class="widget-heading">Tracked Hours</div>
                            <div class="widget-subheading">Total hourly hours</div>
                        </div>
                        <div class="widget-content-right">
                            <div class="widget-numbers text-warning" id="total-hourly-hours"><span>0</span></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="col-md-6">
        <div class="main-card mb-3 card">
            <div class="card-body  pt-4 pb-4">
                <div style="display:flex; align-items:flex-start; gap:12px; margin-bottom:14px">
                    <h5 class="card-title">Add Current Month Total</h5>
                <div style="flex:1"></div>
                    <button type="button" class="btn btn-info" id="addtoSheet-hourly">
                        Skip Form &amp; Add to Sheet &rarr;
                    </button>
                </div>

                <form id="addMonthTotalForm"> 
                    <div class="position-relative form-group"> 
                        <label for="fValue" class="visually-hidden">Current Month Total</label> 
                        <input name="fValue" id="fValue" placeholder="Enter Current Month Total" type="number" step="0.01" class="form-control" required="" > 
                    </div> 
                    <button type="submit" class="mt-1 btn btn-primary"> Submit </button> 
                </form>

            </div>
        </div>
    </div>
</div>
