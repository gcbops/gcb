<div id="gcb-login-screen" class="gcb-login-screen d-none">
  <div class="gcb-login-card card">

    <div class="gcb-login-brand">
      <div class="gcb-login-logo">
        <i class="fa-solid fa-chart-line"></i>
      </div>

      <div>
        <div class="gcb-login-title">
          Go Crayons GS
        </div>

        <div class="gcb-login-subtitle">
          Business Operations Dashboard
        </div>
      </div>
    </div>

    <div class="gcb-login-content">

      <h1>
        Welcome back
      </h1>

      <p>
        Sign in with your authorized Google account to continue.
      </p>

      <button
        type="button"
        id="gcb-google-login-button"
        class="gcb-google-login-button"
      >
        <span class="gcb-google-icon">
          <img src="https://s15.gifyu.com/images/bQgsZ.png">
        </span>

        <span class="gcb-google-login-text">
          Continue with Google
        </span>

        <span
          class="gcb-login-spinner d-none"
          aria-hidden="true"
        >
          <i class="fa-solid fa-circle-notch fa-spin"></i>
        </span>
      </button>

      <div
        id="gcb-login-error"
        class="gcb-login-error d-none"
      ></div>

      <div class="gcb-login-note">
        Access is limited to authorized GCB users.
      </div>

    </div>

  </div>
</div>
