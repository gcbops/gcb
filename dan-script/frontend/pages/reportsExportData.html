<div class="main">

	<div class="row g-4 mb-4" id="reportsExportDataCounts">
		<div class="col-md-3">
			<div class="card card-stat">
				<div class="card-body">
					<i class="bi bi-file-earmark-text text-primary"></i>
					<h5 class="mt-3">Monthly Reports</h5>
					<h2 id="monthly-reports-count">0</h2>
				</div>
			</div>
		</div>
		<div class="col-md-3">
			<div class="card card-stat">
				<div class="card-body">
					<i class="bi bi-calendar-check text-success">
					</i>
					<h5 class="mt-3">Yearly Reports</h5>
					<h2 id="yearly-reports-count">0</h2>
				</div>
			</div>
		</div>
		<div class="col-md-3">
			<div class="card card-stat">
				<div class="card-body">
					<i class="bi bi-file-earmark-pdf text-danger">
					</i>
					<h5 class="mt-3">PDF Generated</h5>
					<h2 id="pdf-generated-count">0</h2>
				</div>
			</div>
		</div>
		<div class="col-md-3">
			<div class="card card-stat">
				<div class="card-body">
					<i class="bi bi-cloud-check text-warning">
					</i>
					<h5 class="mt-3">Automation</h5>
					<h2 id="automation-status">Active</h2>
				</div>
			</div>
		</div>
	</div>
	<div class="row g-4 mb-4">
		<div class="col-md-6">
			<div class="card">
				<div class="card-header">
					Generate Reports
				</div>
				<div class="card-body">
					<div class="d-grid gap-3">
						<button class="btn btn-primary btn-lg" id="generate-monthly-report">
							<i class="fa-solid fa-calendar-day"></i>
							Generate Monthly Report
						</button>
						<button class="btn btn-success btn-lg" id="generate-yearly-report">
							<i class="fa-regular fa-calendar"></i>
							Generate Yearly Report
						</button>
						<button class="btn btn-danger btn-lg" id="download-latest-pdf">
							<i class="bi bi-file-earmark-pdf">
							</i>
							Download Latest PDF
						</button>
						<button class="btn btn-warning btn-lg" id="email-latest-report">
							<i class="bi bi-envelope-fill">
							</i>
							Email Latest Report
						</button>
						<button class="btn btn-dark btn-lg" id="send-discord-notification">
							<i class="bi bi-discord">
							</i>
							Send Discord Notification
						</button>
					</div>
				</div>
			</div>
		</div>
		<div class="col-md-6">
			<div class="card">
				<div class="card-header">
					Quick Status
				</div>
				<div class="card-body">
					<table class="table" id="reportsExportDataHistories">
						<tr>
							<td>Last Monthly Report</td>
							<td id="last-monthly-report"></td>
						</tr>
						<tr>
							<td>Last Yearly Report</td>
							<td id="last-yearly-report"></td>
						</tr>
						<tr>
							<td>Next Scheduled</td>
							<td id="next-scheduled-report"></td>
						</tr>
						<tr>
							<td>Drive Storage</td>
							<td id="drive-storage-status">Connected</td>
						</tr>
						<tr>
							<td>Discord</td>
							<td class="text-success" id="discord-status">Connected</td>
						</tr>
						<tr>
							<td>Email</td>
							<td class="text-success" id="email-status">Connected</td>
						</tr>
					</table>
				</div>
			</div>
		</div>
	</div>
	<div class="row">
		<div class="col-md-12">
			<div class="main-card mb-3 card">
				<div class="card-body">
					<div class="d-flex align-items-start mb-3">

						<h5 class="card-title mb-0">
						Recent Generated Reports
						</h5>

					</div>
					<div id="table-wrapper" class="mt-4">
						<table id="reports-export-table" class="table table-hover nowrap" style="width:100%">
							<thead>
								<tr>
									<th class="text-center">#</th>
									<th>Date</th>
									<th class="text-center">Name</th>
									<th class="text-center">Type</th>
									<th class="text-center">Action</th>
								</tr>
							</thead>
							<tbody id="data-table-body"></tbody>
						</table>
					</div>
				</div>
			</div>
		</div>
	</div>

</div>
