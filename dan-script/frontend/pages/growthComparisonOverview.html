<div class="row" id="growth-comparison">

  <!-- TOTAL HOURS -->
  <div class="col-md-6 col-xl-4 mb-4">
    <div class="card card-shadow-sm border-0 bg-white">
      <div class="card-body">

        <div class="d-flex justify-content-between align-items-center mb-2">
          <div>
            <div class="text-uppercase font-size-xs text-muted font-weight-bold tracking-wider mb-1">
              Total Hours
            </div>

            <div class="h3 mb-0 font-weight-bold text-dark">
              <span data-metric="hours">0.0</span>
              <span class="font-size-sm font-weight-normal text-secondary">
                hrs
              </span>
            </div>
          </div>
        </div>

        <div
          data-trend="hours"
          data-comparison-label="vs last year"
          class="pt-2 border-top font-size-xs text-secondary"
        >
          —
          vs last year
        </div>

      </div>
    </div>
  </div>

<div class="row">
  <div class="col-md-12">
    <div class="main-card mb-3 card">
      <div class="card-body">

        <div class="chart-header">
          <div class="chart-title">
            <h5 class="card-title mb-1">
              Monthly Hours
            </h5>

            <p class="text-secondary m-0 fs-7">
              Hours logged per month
            </p>
          </div>

          <div class="chart-filters d-flex align-items-center gap-2">

            <select
              id="monthlyHoursYearFilter"
              class="chart-filter-control js-select2"
              multiple
            ></select>

            <button
              type="button"
              id="monthlyHoursFilterSubmit"
              class="btn btn-light chart-filter-control chart-filter-submit"
            >
              Apply
            </button>

          </div>
        </div>

        <div class="chart-loading-container">

          <div
            id="chart-monthly_hours_by_year-loading"
            class="chart-loading-overlay d-none"
          >
            <div class="chart-loading-content">

              <div class="chart-loading-spinner"></div>

              <div class="chart-loading-text">
                Updating chart...
              </div>

            </div>
          </div>

          <div
            id="chart-monthly_hours_by_year"
            style="height:400px;"
          >
            <div class="bar-loader">
              <span></span>
              <span></span>
              <span></span>
            </div>
          </div>

        </div>

      </div>
    </div>
  </div>
</div>

<div class="row">

</div>
