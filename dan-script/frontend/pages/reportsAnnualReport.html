<div class="main">

    <div class="row g-4 mb-4">
        <div class="col-md-6">
            <div class="card mb-4">
                <div class="card-header">
                    Generate Report
                </div>

                <div class="card-body">
                    <form class>

                        <div class="position-relative">
                            <label class="form-label">Year</label>

                            <select class="form-select form-control" type="select" id="yearly-report-year"></select>
                        </div>

                        <button class="btn btn-primary btn-lg" id="btn-generate-yearly-report">
                            <i class="bi bi-play-fill"></i>
                            Generate Annual Report
                        </button>
                    </form>
                </div>
            </div>
            <div class="card">
                <div class="card-header">
                    Quick Actions
                </div>
                <div class="card-body">
                    <div class="d-grid gap-3">
                        <button class="btn btn-success btn-lg" id="generate-monthly-report">
                            <i class="fa-solid fa-calendar-day"></i>
                            Generate Monthly Report
                        </button>
                        <button class="btn btn-danger btn-lg" id="download-latest-pdf">
                            <i class="fa-solid fa-file-pdf"></i>
                            Download Latest PDF
                        </button>
                        <button class="btn btn-warning btn-lg" id="email-latest-report">
                            <i class="fa-solid fa-envelope"></i>
                            Email Latest Report
                        </button>
                        <button class="btn btn-dark btn-lg" id="send-discord-notification">
                            <i class="fa-brands fa-discord"></i>
                            Send Discord Notification
                        </button>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-md-6">
            <div class="row">
                <div class="col-md-12">
                    <div class="main-card mb-3 card">
                        <div class="card-body">
                            <div class="d-flex align-items-start mb-3">

                                <h5 class="card-title mb-0">
                                Recent Generated Reports
                                </h5>

                            </div>
                            <div id="table-wrapper" class="mt-4">
                                <table id="yearly-report-history" class="table table-hover nowrap" style="width:100%">
                                <thead>
                                    <tr>
                                        <th class="text-center">#</th>
                                        <th>Date</th>
                                        <th class="text-center">Name</th>
                                        <th class="text-center">Action</th>
                                    </tr>
                                </thead>
                                <tbody id="data-table-body"></tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

</div>
