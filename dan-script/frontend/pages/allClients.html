<div class="row">
    <div class="col-md-12">

        <div class="main-card mb-3 card">
            <div class="card-body">
            <div class="d-flex align-items-start mb-3">

                <h5 class="card-title mb-0">
                    Client Account Summary
                </h5>

                <div class="ms-auto d-flex justify-content-end">
                    <button type="button" class="btn btn-light mb-2 me-2" id="sync-clients-list" > <i class="fa fa-sync"></i></button>
                    <button type="button" class="btn btn-primary mb-2" id="add-new-client-sheet"><i class="fa fa-plus"></i></button>
                </div>

            </div>
            <div id="table-wrapper" class="mt-4">
                <table id="clientsTable" class="table table-hovered nowrap" style="width:100%">
                    <thead>
                        <tr>
                            <th>Client</th>
                            <th class="text-center">Projects</th>
                            <th class="text-center">Paid</th>
                            <th class="text-center">Owed</th>
                            <th class="text-center">Status</th>
                            <th class="text-center">Action</th>
                        </tr>
                    </thead>   
                    <tbody id="dataBody"></tbody>
                </table>
            </div>
            </div>
        </div>

    </div>
</div>
