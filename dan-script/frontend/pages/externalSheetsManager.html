<div class="row">
  <div class="col-lg-12">

    <div class="main-card mb-3 card">
      <div class="card-body">

        <div class="d-flex align-items-start mb-3">

          <h5 class="card-title mb-0">
            External Sheets
          </h5>

          <div class="ms-auto d-flex justify-content-end">
            <button
                type="button"
                class="btn btn-light mb-2 me-2"
                id="sync-external-sheets"
            >
                <i class="fa fa-sync"></i>
            </button>
            <button
              type="button"
              class="btn btn-primary mb-2"
              id="add-external-sheet"
            >
              <i class="fa fa-plus"></i>
            </button>
          </div>

        </div>

        <div id="dt-container" class="mt-4">

          <table
            id="externalSheetsTable"
            class="table table-hovered nowrap"
            style="width:100%"
          >

            <thead>
              <tr>
                <th>Client Name</th>
                <th>Total Hours</th>
                <th>Projects</th>
                <th class="text-center">Status</th>
                <th class="text-center">Actions</th>
              </tr>
            </thead>

            <tbody></tbody>

          </table>

        </div>

      </div>
    </div>

  </div>
</div>
