<div class="row" id="daily-overview-summary">

  <!-- TODAY'S HOURS -->
  <div class="col-md-6 col-xl-4 mb-4">
    <div class="card card-shadow-sm border-0 bg-white">
      <div class="card-body">

        <div class="d-flex justify-content-between align-items-center">
          <div>
            <div class="text-uppercase font-size-xs text-muted font-weight-bold tracking-wider mb-1">
              Hours Today
            </div>

            <div class="h3 mb-0 font-weight-bold text-dark">
              <span data-metric="today-hours">0.0</span>
              <span class="font-size-sm font-weight-normal text-secondary">
                hrs
              </span>
            </div>
          </div>
        </div>

        <div
          data-metric="hours-yesterday"
          class="pt-2 mt-2 border-top font-size-xs text-muted"
        >
          No comparison available
        </div>

      </div>
    </div>
  </div>


  <!-- ACTIVE CLIENTS -->
  <div class="col-md-6 col-xl-4 mb-4">
    <div class="card card-shadow-sm border-0 bg-white">
      <div class="card-body">

        <div class="d-flex justify-content-between align-items-center">
          <div>
            <div class="text-uppercase font-size-xs text-muted font-weight-bold tracking-wider mb-1">
              Active Clients
            </div>

            <div class="h3 mb-0 font-weight-bold text-dark">
              <span data-metric="active-clients">0</span>
              <span class="font-size-sm font-weight-normal text-secondary">
                clients
              </span>
            </div>
          </div>
        </div>

        <div
          data-metric="clients-yesterday"
          class="pt-2 mt-2 border-top font-size-xs text-muted"
        >
          No comparison available
        </div>

      </div>
    </div>
  </div>


  <!-- MONTHLY HOURS -->
  <div class="col-md-6 col-xl-4 mb-4">
    <div class="card card-shadow-sm border-0 bg-white">
      <div class="card-body">

        <div class="d-flex justify-content-between align-items-center">
          <div>
            <div class="text-uppercase font-size-xs text-muted font-weight-bold tracking-wider mb-1">
              Monthly Hours
            </div>

            <div class="h3 mb-0 font-weight-bold text-dark">
              <span data-metric="month-hours">0.0</span>
              <span class="font-size-sm font-weight-normal text-secondary">
                hrs
              </span>
            </div>
          </div>
        </div>

        <div
          data-metric="month-previous"
          class="pt-2 mt-2 border-top font-size-xs text-muted"
        >
          No comparison available
        </div>

      </div>
    </div>
  </div>


  <!-- DAILY AVERAGE -->
  <div class="col-md-6 col-xl-4 mb-4">
    <div class="card card-shadow-sm border-0 bg-white">
      <div class="card-body">

        <div class="text-uppercase font-size-xs text-muted font-weight-bold tracking-wider mb-1">
          Daily Average
        </div>

        <div class="h3 mb-0 font-weight-bold text-dark">
          <span data-metric="month-average">0.0</span>
          <span class="font-size-sm font-weight-normal text-secondary">
            hrs/day
          </span>
        </div>

      </div>
    </div>
  </div>


  <!-- YESTERDAY -->
  <div class="col-md-6 col-xl-4 mb-4">
    <div class="card card-shadow-sm border-0 bg-white">
      <div class="card-body">

        <div class="text-uppercase font-size-xs text-muted font-weight-bold tracking-wider mb-1">
          Yesterday
        </div>

        <div class="h3 mb-0 font-weight-bold text-dark">
          <span data-metric="yesterday-hours">0.0</span>
          <span class="font-size-sm font-weight-normal text-secondary">
            hrs
          </span>
        </div>

      </div>
    </div>
  </div>


  <!-- OVERALL HOURS -->
  <div class="col-md-6 col-xl-4 mb-4">
    <div class="card card-shadow-sm border-0 bg-white">
      <div class="card-body">

        <div class="text-uppercase font-size-xs text-muted font-weight-bold tracking-wider mb-1">
          Overall Working Hours
        </div>

        <div class="h3 mb-0 font-weight-bold text-dark">
          <span data-metric="overall-hours">0.0</span>
          <span class="font-size-sm font-weight-normal text-secondary">
            hrs
          </span>
        </div>

      </div>
    </div>
  </div>

</div>

<div class="row">
  <div class="col-md-12">
    <div class="main-card mb-3 card">
      <div class="card-body">

        <div class="chart-header">
          <div class="chart-title">
            <h5 class="card-title mb-1">
              Daily Hours
            </h5>

            <p class="text-secondary m-0 fs-7">
              Hours logged per client
            </p>
          </div>

          <div class="chart-filters d-flex align-items-center gap-2">

            <input
              type="text"
              id="dailyOverviewDateRange"
              class="chart-filter-control custom-flatpickr form-control"
              placeholder="Select date range"
              readonly
            />

            <button
              type="button"
              id="dailyOverviewFilterSubmit"
              class="btn btn-light chart-filter-control chart-filter-submit"
            >
              Apply
            </button>

          </div>
        </div>

        <div class="chart-loading-container">

          <div
            id="chart-daily_overview-loading"
            class="chart-loading-overlay d-none"
          >
            <div class="chart-loading-content">

              <div class="chart-loading-spinner"></div>

              <div class="chart-loading-text">
                Updating chart...
              </div>

            </div>
          </div>

          <div
            id="chart-daily_overview"
            style="height:400px;"
          >
            <div class="bar-loader">
              <span></span>
              <span></span>
              <span></span>
            </div>
          </div>

        </div>

      </div>
    </div>
  </div>
</div>
