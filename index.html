<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <link rel="apple-touch-icon" sizes="180x180" href="/gcb/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/gcb/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/gcb/favicon-16x16.png">
  <link rel="manifest" href="/gcb/site.webmanifest">

  <title>Go Crayons GS</title>

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
    }

    iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>

<body>

  <iframe id="gcb-app"></iframe>

<script>
  const GCB_GAS_URL =
    "https://script.google.com/macros/s/AKfycbwdipuZqlldoU7utdQ6gAK0XLsog96TMCg02MUYvNz8ix6LWsOt-cqX5R5YCvsQ4OnT/exec";

  const iframe = document.getElementById("gcb-app");

  let navigationTimer = null;
  let navigationRequestId = 0;
  let restoringHistory = false;

  function getPageFromUrl() {
    return new URLSearchParams(window.location.search).get("page");
  }

  function getGasUrl(page, client = "", navigationId = "") {
    const url = new URL(GCB_GAS_URL);

    url.searchParams.set("wrapper", "github");

    if (page && page !== "home") {
      url.searchParams.set("page", page);
    }

    if (client) {
      url.searchParams.set(
        "client",
        client.replace(/\s+/g, "_"),
      );
    }

    if (navigationId) {
      url.searchParams.set("nav", navigationId);
    }

    return url.href;
  }

  function loadGasPage(page, client = "") {
    iframe.src = getGasUrl(page, client);
  }

  function navigateGasPage(page, client = "") {
    const requestId = ++navigationRequestId;

    clearTimeout(navigationTimer);

    navigationTimer = setTimeout(() => {
      if (requestId !== navigationRequestId) {
        return;
      }

      const url = getGasUrl(
        page,
        client,
        `${Date.now()}_${requestId}`,
      );

      iframe.dataset.gcbRequestedUrl = url;

      console.log("[GitHub] GAS REQUEST:", {
        page,
        client,
        url,
      });

      iframe.contentWindow.location.replace(url);
    }, 100);
  }

  /*
   * ------------------------------------------------
   * Diagnostics
   * ------------------------------------------------
   */

  iframe.addEventListener("load", () => {
    console.log("[GitHub] iframe LOAD:", {
      requestedUrl: iframe.dataset.gcbRequestedUrl || "",
      parentUrl: window.location.href,
      historyLength: window.history.length,
      historyState: window.history.state,
    });
  });

  /*
   * ------------------------------------------------
   * GitHub URL / history
   * ------------------------------------------------
   */

  function updateGitHubUrl(page, client = "", replace = false) {
    const url = new URL(window.location.href);

    const normalizedPage = page || "home";

    const normalizedClient =
      typeof client === "string"
        ? client.trim().replace(/_/g, " ")
        : "";

    if (normalizedPage !== "home") {
      url.searchParams.set("page", normalizedPage);
    } else {
      url.searchParams.delete("page");
    }

    if (normalizedClient) {
      url.searchParams.set(
        "client",
        normalizedClient.replace(/\s+/g, "_"),
      );
    } else {
      url.searchParams.delete("client");
    }

    const state = {
      gcbPage: normalizedPage,
      gcbClient: normalizedClient,
    };

    if (replace) {
      window.history.replaceState(state, "", url);
    } else {
      window.history.pushState(state, "", url);
    }
  }

  /*
   * ------------------------------------------------
   * Initial state
   * ------------------------------------------------
   */

  const initialUrl = new URL(window.location.href);

  const initialPage =
    initialUrl.searchParams.get("page") || "home";

  const initialClient =
    initialUrl.searchParams.get("client") || "";

  const initialState = {
    gcbPage: initialPage,
    gcbClient: initialClient,
  };

  window.history.replaceState(
    initialState,
    "",
    initialUrl,
  );

  loadGasPage(initialPage, initialClient);

  /*
   * ------------------------------------------------
   * GAS → GitHub navigation
   * ------------------------------------------------
   */

  window.addEventListener("message", (event) => {
    if (event.data?.type !== "GCB_NAVIGATION") {
      return;
    }

    const page = event.data.page;
    const client = event.data.client || "";

    if (!page) {
      return;
    }

    if (restoringHistory) {
      return;
    }

    updateGitHubUrl(page, client);
  });

  /*
   * ------------------------------------------------
   * Browser Back / Forward
   * ------------------------------------------------
   */

  window.addEventListener("popstate", (event) => {
    console.log("[GitHub] POP STATE:", {
      eventState: event.state,
      historyState: window.history.state,
      historyLength: window.history.length,
      url: window.location.href,
    });

    const page =
      event.state?.gcbPage ||
      getPageFromUrl() ||
      "home";

    const client =
      event.state?.gcbClient ||
      new URL(window.location.href).searchParams.get("client") ||
      "";

    navigateGasPage(page, client);
  });
</script>

</body>
</html>
