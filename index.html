<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <link rel="apple-touch-icon" sizes="180x180" href="/gcb/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/gcb/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/gcb/favicon-16x16.png">
  <link rel="manifest" href="/gcb/site.webmanifest">

  <title>Go Crayons GS</title>

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
    }

    iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>

<body>

  <iframe id="gcb-app"></iframe>

  <script>
    const GCB_GAS_URL =
      "https://script.google.com/macros/s/AKfycbwdipuZqlldoU7utdQ6gAK0XLsog96TMCg02MUYvNz8ix6LWsOt-cqX5R5YCvsQ4OnT/exec";

    const iframe = document.getElementById("gcb-app");

    function getPageFromUrl() {
      return new URLSearchParams(window.location.search).get("page");
    }

    function getGasUrl(page) {
      const url = new URL(GCB_GAS_URL);

      url.searchParams.set("wrapper", "github");

      if (page && page !== "home") {
        url.searchParams.set("page", page);
      }

      return url.href;
    }

    function loadGasPage(page) {
      iframe.src = getGasUrl(page);
    }

    function updateGitHubUrl(page, replace = false) {
      const url = new URL(window.location.href);

      if (page && page !== "home") {
        url.searchParams.set("page", page);
      } else {
        url.searchParams.delete("page");
      }

      const state = {
        gcbPage: page || "home",
      };

      if (replace) {
        window.history.replaceState(state, "", url);
      } else {
        window.history.pushState(state, "", url);
      }
    }

    /*
    * ------------------------------------------------
    * Initial state
    * ------------------------------------------------
    */

    const initialPage = getPageFromUrl() || "home";

    updateGitHubUrl(initialPage, true);
    loadGasPage(initialPage);

    /*
    * ------------------------------------------------
    * GAS → GitHub navigation
    * ------------------------------------------------
    */

    window.addEventListener("message", (event) => {
      console.log("[GitHub] Navigation message:", {
        origin: event.origin,
        data: event.data,
      });

      if (event.data?.type !== "GCB_NAVIGATION") {
        return;
      }

      const page = event.data.page;

      if (!page) {
        return;
      }

      console.log("[GitHub] Navigation received:", page);

      updateGitHubUrl(page);
    });

    /*
    * ------------------------------------------------
    * Browser Back / Forward
    * ------------------------------------------------
    */

    window.addEventListener("popstate", (event) => {
      const page =
        event.state?.gcbPage ||
        getPageFromUrl() ||
        "home";

      loadGasPage(page);
    });
  </script>

</body>
</html>
