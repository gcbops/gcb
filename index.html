<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <link rel="apple-touch-icon" sizes="180x180" href="/gcb/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/gcb/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/gcb/favicon-16x16.png">
  <link rel="manifest" href="/gcb/site.webmanifest">

  <title>Go Crayons GS</title>

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
    }

    iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>

<body>

  <iframe id="gcb-app"></iframe>

<script>
  const GCB_GAS_URL =
    "https://script.google.com/macros/s/AKfycbwdipuZqlldoU7utdQ6gAK0XLsog96TMCg02MUYvNz8ix6LWsOt-cqX5R5YCvsQ4OnT/exec";

  let iframe = document.getElementById("gcb-app");

  let navigationTimer = null;
  let navigationRequestId = 0;
  let restoringHistory = false;

  function getPageFromUrl() {
    return new URLSearchParams(window.location.search).get("page");
  }

  function getGasUrl(
    page,
    client = "",
    navigationId = "",
    authTicket = "",
  ) {
    const url = new URL(GCB_GAS_URL);

    url.searchParams.set("wrapper", "github");

    if (page && page !== "home") {
      url.searchParams.set("page", page);
    }

    if (client) {
      url.searchParams.set(
        "client",
        client.replace(/\s+/g, "_"),
      );
    }

    if (navigationId) {
      url.searchParams.set("nav", navigationId);
    }

    if (authTicket) {
      url.searchParams.set(
        "auth_ticket",
        authTicket,
      );
    }

    return url.href;
  }

  function loadGasPage(
    page,
    client = "",
    authTicket = "",
  ) {
    const url = getGasUrl(
      page,
      client,
      "",
      authTicket,
    );

    iframe.dataset.gcbRequestedUrl = url;
    iframe.src = url;
  }

  function replaceGasIframe(url) {
    const oldIframe = iframe;

    const newIframe = document.createElement("iframe");

    newIframe.id = "gcb-app";
    newIframe.src = url;
    newIframe.dataset.gcbRequestedUrl = url;

    oldIframe.replaceWith(newIframe);

    iframe = newIframe;

    return newIframe;
  }

  function navigateGasPage(page, client = "") {
    const requestId = ++navigationRequestId;

    clearTimeout(navigationTimer);

    navigationTimer = setTimeout(() => {
      if (requestId !== navigationRequestId) {
        return;
      }

      const url = getGasUrl(
        page,
        client,
        `${Date.now()}_${requestId}`,
      );

      replaceGasIframe(url);
    }, 100);
  }

  /*
   * ------------------------------------------------
   * GitHub URL / history
   * ------------------------------------------------
   */

  function updateGitHubUrl(page, client = "", replace = false) {
    const url = new URL(window.location.href);

    const normalizedPage = page || "home";

    const normalizedClient =
      typeof client === "string"
        ? client.trim().replace(/_/g, " ")
        : "";

    if (normalizedPage !== "home") {
      url.searchParams.set("page", normalizedPage);
    } else {
      url.searchParams.delete("page");
    }

    if (normalizedClient) {
      url.searchParams.set(
        "client",
        normalizedClient.replace(/\s+/g, "_"),
      );
    } else {
      url.searchParams.delete("client");
    }

    const state = {
      gcbPage: normalizedPage,
      gcbClient: normalizedClient,
    };

    if (replace) {
      window.history.replaceState(state, "", url);
    } else {
      window.history.pushState(state, "", url);
    }
  }

  /*
   * ------------------------------------------------
   * Initial state
   * ------------------------------------------------
   */

  const initialUrl = new URL(window.location.href);

  const initialPage =
    initialUrl.searchParams.get("page") || "home";

  const initialClient =
    initialUrl.searchParams.get("client") || "";

  const initialAuthTicket =
    initialUrl.searchParams.get(
      "gcb_auth_ticket",
    ) || "";

  const initialState = {
    gcbPage: initialPage,
    gcbClient: initialClient,
  };

  window.history.replaceState(
    initialState,
    "",
    initialUrl,
  );

  loadGasPage(
    initialPage,
    initialClient,
    initialAuthTicket,
  );

  /*
   * ------------------------------------------------
   * GAS → GitHub navigation
   * ------------------------------------------------
   */

  window.addEventListener("message", (event) => {
    // console.log(
    //   "[GCB Wrapper] Message received:",
    //   event.origin,
    //   event.data,
    // );

    const isGcbGasOrigin =
      event.origin === "https://script.google.com" ||
      event.origin.endsWith("-script.googleusercontent.com");

    if (!isGcbGasOrigin) {
      // console.log(
      //   "[GCB Wrapper] Ignored message from unexpected origin:",
      //   event.origin,
      // );

      return;
    }

    if (
      event.data?.type ===
      "GCB_LOGIN_REQUEST"
    ) {
      // console.log(
      //   "[GCB Wrapper] GCB_LOGIN_REQUEST received.",
      // );

      const loginUrl =
        event.data?.url;

        // console.log(
        //   "[GCB Wrapper] Login URL:",
        //   loginUrl,
        // );

      if (!loginUrl) {
        console.error(
          "[GCB Wrapper] Login URL is missing.",
        );
        return;
      }

      // console.log(
      //   "[GCB Wrapper] Navigating top-level window to Google OAuth.",
      // );

      window.location.href = loginUrl;

      return;
    }

    if (
      event.data?.type ===
      "GCB_AUTH_HANDOFF_COMPLETE"
    ) {
      // console.log(
      //   "[GCB Wrapper] GCB_AUTH_HANDOFF_COMPLETE received.",
      // );

      const url =
        new URL(window.location.href);

      url.searchParams.delete(
        "gcb_auth_ticket",
      );

      window.history.replaceState(
        window.history.state,
        "",
        url,
      );

      // console.log(
      //   "[GCB Wrapper] Authentication ticket removed from URL.",
      // );

      return;
    }

    if (
      event.data?.type !==
      "GCB_NAVIGATION"
    ) {
      console.error(
        "[GCB Wrapper] Message was not a recognized GCB message.",
      );
      return;
    }

    const page = event.data.page;
    const client =
      event.data.client || "";

    if (!page) {
      return;
    }

    if (restoringHistory) {
      return;
    }

    updateGitHubUrl(
      page,
      client,
    );
  });

  /*
   * ------------------------------------------------
   * Browser Back / Forward
   * ------------------------------------------------
   */

  window.addEventListener("popstate", (event) => {

    const page =
      event.state?.gcbPage ||
      getPageFromUrl() ||
      "home";

    const client =
      event.state?.gcbClient ||
      new URL(window.location.href).searchParams.get("client") ||
      "";

    navigateGasPage(page, client);
  });
</script>

</body>
</html>
