<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <link rel="apple-touch-icon" sizes="180x180" href="/gcb/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/gcb/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/gcb/favicon-16x16.png">
  <link rel="manifest" href="/gcb/site.webmanifest">

  <title>Go Crayons GS</title>

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
    }

    iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>

<body>

  <iframe
    id="gcb-app"
    src="https://script.google.com/macros/s/AKfycbwdipuZqlldoU7utdQ6gAK0XLsog96TMCg02MUYvNz8ix6LWsOt-cqX5R5YCvsQ4OnT/exec"
  ></iframe>

  <script>
    const GCB_APP_ORIGIN = "https://script.google.com";
    const iframe = document.getElementById("gcb-app");

    let currentPage = "home";

    if (!history.state?.gcbPage) {
      history.replaceState(
        { gcbPage: "home" },
        "",
        window.location.pathname,
      );
    } else {
      currentPage = history.state.gcbPage;
    }

    window.addEventListener("message", (event) => {
      if (event.origin !== GCB_APP_ORIGIN) {
        return;
      }

      if (event.data?.type !== "GCB_NAVIGATION") {
        return;
      }

      const page = event.data.page;

      if (!page || page === currentPage) {
        return;
      }

      currentPage = page;

      history.pushState(
        { gcbPage: page },
        "",
        window.location.pathname + "?page=" + encodeURIComponent(page),
      );
    });

    window.addEventListener("popstate", (event) => {
      const page = event.state?.gcbPage;

      if (!page) {
        return;
      }

      currentPage = page;

      iframe.contentWindow.postMessage(
        {
          type: "GCB_HISTORY_NAVIGATION",
          page,
        },
        GCB_APP_ORIGIN,
      );
    });
  </script>
  
</body>
</html>
