<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <link rel="apple-touch-icon" sizes="180x180" href="/gcb/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/gcb/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/gcb/favicon-16x16.png">
  <link rel="manifest" href="/gcb/site.webmanifest">

  <title>Go Crayons GS</title>

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
    }

    iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>

<body>

  <iframe
    id="gcb-app"
    src="https://script.google.com/macros/s/AKfycbwdipuZqlldoU7utdQ6gAK0XLsog96TMCg02MUYvNz8ix6LWsOt-cqX5R5YCvsQ4OnT/exec"
  ></iframe>

  <script>
    const GCB_APP_ORIGIN = "*";
    const GCB_GAS_HOST_SUFFIX = "-script.googleusercontent.com";
    const iframe = document.getElementById("gcb-app");

    console.log("[GCB Wrapper] Initialized:", {
  appOrigin: GCB_APP_ORIGIN,
  iframeSrc: iframe.src,
  parentOrigin: window.location.origin,
});

    const validPage = (page) =>
      typeof page === "string" && page.trim() !== "";

    const getPageFromUrl = () => {
      const params = new URLSearchParams(window.location.search);
      return params.get("page");
    };

    function isGcbGasOrigin(origin) {
      try {
        return new URL(origin).hostname.endsWith(GCB_GAS_HOST_SUFFIX);
      } catch {
        return false;
      }
    }

    let currentPage = getPageFromUrl() || "home";

    // Establish the initial history state without removing ?page=...
    if (!history.state?.gcbPage) {
      history.replaceState(
        { gcbPage: currentPage },
        "",
        window.location.href,
      );
    }

    window.addEventListener("message", (event) => {
  console.log("[GCB Wrapper] Message received:", {
    origin: event.origin,
    expectedGasOrigin: "hostname ending with -script.googleusercontent.com",
    data: event.data,
  });

  if (!isGcbGasOrigin(event.origin)) {
    console.warn("[GCB Wrapper] Rejected message origin:", event.origin);
    return;
  }

  if (event.data?.type !== "GCB_NAVIGATION") {
    console.warn("[GCB Wrapper] Unknown message type:", event.data);
    return;
  }

  const page = event.data.page;

  console.log("[GCB Wrapper] Navigation received:", {
    page,
    currentPage,
    urlBefore: window.location.href,
  });

  if (!validPage(page) || page === currentPage) {
    console.log("[GCB Wrapper] Navigation ignored:", {
      valid: validPage(page),
      samePage: page === currentPage,
    });
    return;
  }

  currentPage = page;

  const url = new URL(window.location.href);
  url.searchParams.set("page", page);

  history.pushState(
    { gcbPage: page },
    "",
    url.href,
  );

  console.log("[GCB Wrapper] URL updated:", window.location.href);
});

    window.addEventListener("popstate", (event) => {
  const page =
    event.state?.gcbPage ||
    getPageFromUrl();

  console.log("[GCB Wrapper] Browser popstate:", {
    state: event.state,
    page,
    url: window.location.href,
    targetOrigin: GCB_APP_ORIGIN,
  });

  if (!validPage(page)) {
    return;
  }

  currentPage = page;

  console.log("[GCB Wrapper] Sending history navigation to GAS:", {
    page,
    targetOrigin: GCB_APP_ORIGIN,
  });

  iframe.contentWindow.postMessage(
    {
      type: "GCB_HISTORY_NAVIGATION",
      page,
    },
    GCB_APP_ORIGIN,
  );
});

    iframe.addEventListener("load", () => {
  console.log("[GCB Wrapper] iframe loaded:", {
    src: iframe.src,
    currentPage,
    targetOrigin: GCB_APP_ORIGIN,
  });

  iframe.contentWindow.postMessage(
    {
      type: "GCB_HISTORY_NAVIGATION",
      page: currentPage,
    },
    GCB_APP_ORIGIN,
  );
});
  </script>
  
</body>
</html>
